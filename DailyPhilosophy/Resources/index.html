habermas:['Habermas holds that language aims at mutual understanding, and that norms are valid if all affected could accept them in rational discourse. Modern societies divide into the lifeworld of shared meaning and systems of money and power that can colonize it. He defends the Enlightenment as an unfinished project.','Critics say that his ideal speech situation is unrealistic and that it favors a particular kind of rational discourse. Feminist and postcolonial writers, such as Fraser, have argued that the public sphere excluded many groups.','Before your next disagreement, state the other side’s view so well that they would accept it.'],
rorty:['Rorty argues that the idea of a mirror of nature is a mistake: knowledge is a matter of agreement within conversations, and truth is what is good for us to believe. He urges liberal irony: holding commitments while recognizing they are contingent. Literature, he says, does more than philosophy to widen sympathy.','Critics say that this relativism undermines the ability to criticize cruelty. Rorty replied that we can oppose cruelty without philosophical foundations. Analytic philosophers reproached him for dismissing the field.','Read a short story or poem this week and notice whose suffering it makes visible to you.'],
taylor:['Taylor argues that identity is formed dialogically, and that misrecognition can harm. In Sources of the Self he traces ideals of inwardness and the affirmation of ordinary life. In A Secular Age, he explains how belief became one option among many, with a “buzz” of cross-pressures.','Critics say that his notion of recognition may pressure groups to fix identities. Others say that his story of secularization is too tied to Latin Christendom. He has also taken part in debates about accommodation of minorities in Quebec.','Think about who confirms your sense of self. Is there a group whose confirmation you lack, and why?'],
macintyre:['MacIntyre argues that modern moral language is the remains of earlier frameworks. Virtues are qualities that sustain practices and a whole human life’s narrative. Without shared traditions, he says, moral disagreement becomes interminable, and so we face a choice between Nietzsche and Aristotle.','Critics say that his picture of the past is nostalgic and that traditions can be oppressive. Liberals ask whether pluralism offers other resources. His later turn to Aquinas and to Marxist themes also surprised many.','Name a practice you belong to, like a craft or sport. What virtues does it need and teach?'],
sen:['Sen argues that economic growth is only a means. What matters is whether people can achieve valued functionings, like being nourished or taking part in public life. He shows that famines arise from failures of entitlement, and that democracies rarely suffer them. He favors comparing real options over seeking a perfect theory.','Critics ask how to weigh different capabilities without a list. Nussbaum supplies one, which Sen declines. Economists question how to measure freedoms. Others note his optimism about markets and democracy, which he qualifies.','Choose a public service near you. Ask who can actually use it, and who cannot.'],
wiredu:['Wiredu argues that philosophers should check whether the concepts they use, such as “truth” and “existence,” depend on a language like English. He studies Akan terms and finds some distinctions absent. His case for consensual democracy builds on how Akan chiefs sought agreement among elders.','Critics say that the consensus model may not scale to modern states and may suppress dissent. Others question how much Akan practice he generalizes. Still, he raised key methodological questions for African philosophy.','Pick a word from your language that has no neat translation. What does it show about how you think?'],
mbiti:['Mbiti’s African Religions and Philosophy argues that in many African societies, time is measured in events: sasa (now and near past) and zamani (the long past). The future beyond a short span is thin. Individuals exist through kin and ancestors.','Critics say that he generalized across hundreds of cultures and read them through Christian categories. Scholars disputed his claims about time as unsupported. Even so, his book started broad discussion and invited correction.','Draw your own “communal” map: which people and ancestors shape your sense of who you are?'],
oluwole:['Oluwole argues that Ifá’s verses are a body of reasoned thought that can be analyzed like philosophy. She compares Socrates and Orunmila, and argues that oral traditions give evidence of rigorous reflection. She also claimed that some Greek ideas had African sources, which is disputed.','Some critics say that her comparisons are speculative and that oral material is hard to date. Others praise her challenge to a narrow definition of philosophy. She taught for decades and trained many students.','Ask an elder in your community to tell a story that carries a lesson. Write what you learned.'],
dussel:['Dussel argues that the “I conquer” of 1492 preceded Descartes’s “I think.” Modernity, he says, has a hidden underside of colonial violence. Ethics must begin with the face of the poor, as in Levinas, and politics should answer to the needs of the excluded.','Critics say that his reading of modernity is one-sided and sometimes imprecise. Others find his use of Levinas or Marx selective. Nevertheless, his work shaped debates about decolonial thought across Latin America.','Think of the places and voices missing from your usual sources. Add one new source this week.'],
nagel:['Nagel argues that objective science leaves out the subjective character of experience: no physical description tells us what it is like to be a bat. Reductive accounts of the mind therefore seem incomplete. In ethics, he explores the tension between the personal and impersonal standpoints.','Critics, including Dennett, say that the bat argument assumes that subjective facts cannot be explained by science. Some also say that we can learn much about bat experience by studying their brains. Nagel stands by the limits of current concepts.','Describe your morning coffee to someone who has never had it. What cannot be conveyed?'],
nozick:['Nozick’s entitlement theory says a distribution is just if it arose from just acquisition and transfer. His Wilt Chamberlain example claims that free choices upset any patterned distribution, so maintaining a pattern needs constant interference. The experience machine tests whether we want only pleasant states.','Critics say that the theory ignores the unjust origins of property and the needs of the poor. Others argue that most people refuse the machine, but not for the reasons Nozick gives. He later softened some libertarian claims.','Ask yourself whether you would plug into a machine that guaranteed pleasant experience. What does your answer show you value?'],
kripke:['Kripke argues that names are rigid: they pick out the same object in every possible world. Some truths, like “water is H2O,” are necessary but discovered empirically. He also gave a puzzle about rule-following from Wittgenstein: what makes it the case that I mean addition by plus?','Critics dispute the causal picture of reference and the claims about essence. The Wittgenstein reading is also contested as not Wittgenstein’s own view. Still, his lectures reopened metaphysics for analytic philosophy.','Pick a name of someone you know. Ask what would have to be true for it to still be them.'],
parfit:['Parfit’s thought experiments, such as teletransportation and fission, suggest that what matters in survival is not strict identity but relation R: psychological connection. This weakens the grounds for self-concern and strengthens concern for others. In On What Matters, he argues that major moral theories converge.','Critics say that the reductionist view is counterintuitive and that the convergence claim is too optimistic. Others challenge his “repugnant conclusion” about population. Still, he made an unusually careful case for impartial concern.','Imagine your future self ten years from now. Write them a note as you would to a friend.'],
dennett:['Dennett proposes that minds are explained by stances: we treat systems as having beliefs when it helps to predict them. Consciousness has no central “Cartesian theater”; multiple drafts of content are being edited at once. Evolution gives us competence without comprehension.','Critics, such as Chalmers and Nagel, say he explains away consciousness instead of explaining it. Others say his adaptationism is too strong. His readable style made him unusually influential outside philosophy.','Notice a skill you perform without understanding how, such as catching a ball. What does that say about how much “you” are in control?'],
searle:['Searle’s Chinese room says that a person who manipulates symbols by rules does not understand Chinese, and neither does a computer running a program. Syntax is not semantics. He argues that consciousness is a biological feature of brains, like digestion.','Critics offer the systems reply, that the whole room understands, and the robot reply. Others say the argument begs the question. He also faced serious allegations of misconduct in his later career, which are reported separately from his ideas.','Do a calculation by rote, like a multiplication table, and ask what changes when you understand why it works.'],
singer:['Singer argues that if we can prevent something bad without sacrificing anything of comparable moral importance, we ought to do so. Distance does not matter morally. He extends equal consideration to animals’ interests and criticizes “speciesism.” He is a prominent voice for giving effectively.','Critics say his standards are too demanding and ignore special ties and personal projects. Some of his views on disability and infants have drawn strong objections. Defenders say he follows his arguments honestly.','Choose a regular amount you could give to an effective cause. Look up one evaluation of its impact before deciding.'],
nussbaum:['Nussbaum offers a list of central capabilities, including life, health, bodily integrity, senses and imagination, emotions, practical reason, affiliation, play and control over one’s environment. Societies should guarantee a threshold of each. She also argues that emotions are judgments, and that literature builds empathy.','Critics say that the list is paternalistic or culturally narrow. Nussbaum replies that it is open to revision and based on cross-cultural dialogue. She has also written on disgust, anger and religious equality.','Pick one capability from the list. Ask whether everyone in your community really has it.'],
appiah:['Appiah argues that cosmopolitanism combines universal concern with respect for legitimate differences, and that we can disagree without needing to agree. In The Lies That Bind he claims that identities such as creed, country, class, color and culture rest on mistaken ideas of fixed essence. Honor, he says, can drive moral change.','Critics say that cosmopolitanism may be a luxury of the privileged. Others argue that identity categories do real social work even if they are constructed. He has responded that critiquing essences does not mean erasing differences.','Have a conversation with someone whose life differs sharply from yours, and ask what they would like you to understand.'],
butler:['Butler argues that gender is performative: repeated stylized acts that produce the appearance of a stable identity. Norms are enforced, but also can be subverted through parody and variation. Later, they write on vulnerability, grievability and nonviolence.','Critics, including some feminists, say that the theory loses sight of material conditions or the category of women. Others find the writing hard to read. Butler has replied that the aim is to open possibilities, not to deny experiences.','Notice one daily habit that signals who you are to others. Ask which parts are chosen and which expected.'],
chalmers:['Chalmers separates easy problems, explaining functions like attention and memory, from the hard problem of why there is experience. He argues that a physical duplicate without consciousness is conceivable, which suggests that consciousness is not entailed by physics. He considers options including panpsychism.','Critics, such as Dennett, say that the hard problem is an illusion and that conceivability does not show possibility. Others say that science may dissolve the question. He admits that the problem is open and proposes pursuing it.','Close your eyes and notice the felt quality of a sound or a color. Try describing it without using other experiences.']

var S=normalize(loadLocal());
var V={name:'home'};
var sync='local';
var remoteRef=null,saveTimer=null,saving=false,dirty=false;

function normalize(r){
  r=r&&typeof r==='object'?r:{};
  return {
    seen:Array.isArray(r.seen)?r.seen.filter(function(x){return byId(x);}):[],
    notes:r.notes&&typeof r.notes==='object'?r.notes:{},
    deeper:Array.isArray(r.deeper)?r.deeper.filter(function(x){return byId(x);}):[],
    chats:(function(){var o={};if(r.chats&&typeof r.chats==='object'){Object.keys(r.chats).forEach(function(k){if(byId(k)&&Array.isArray(r.chats[k]))o[k]=r.chats[k].filter(function(m){return m&&(m.r==='u'||m.r==='a')&&typeof m.t==='string';}).slice(-60);});}return o;})(),
    day:r.day&&r.day.date?r.day:null,
    updated:typeof r.updated==='number'?r.updated:0
  };
}
function loadLocal(){
  try{if(window.__nativeState){var ns=window.__nativeState;return typeof ns==='string'?JSON.parse(ns):ns;}}catch(e){}
  try{var raw=localStorage.getItem(LS);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function saveLocal(){
  var j=JSON.stringify(S);
  try{localStorage.setItem(LS,j);}catch(e){}
  if(NATIVE)nativePost({type:'save',state:j});
}
function persist(){
  S.updated=Date.now();
  saveLocal();
  if(remoteRef){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
}
function flush(){
  if(!remoteRef||!dirty)return;
  if(saving){saveTimer=setTimeout(flush,700);return;}
  saving=true;dirty=false;
  remoteRef.set(JSON.parse(JSON.stringify(S))).then(function(){sync='synced';}).catch(function(){sync='local';}).then(function(){
    saving=false;
    if(dirty)flush();
    updateNote();
  });
}
function timeout(p,ms){
  return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);
}
function initRemote(){
  try{
    var c=window.claude;
    if(!c||!c.use)return;
    Promise.all([timeout(c.use('db'),10000),timeout(c.use('user'),10000)]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user)return null;
      return user.id().then(function(id){
        if(!id)return null;
        remoteRef=db.collection('data/users/'+id).doc('philosophy');
        return timeout(remoteRef.get(),10000);
      });
    }).then(function(snap){
      if(!remoteRef)return;
      if(snap&&snap.exists){
        var remote=normalize(JSON.parse(JSON.stringify(snap.data())));
        if(remote.updated>S.updated){
          S=remote;saveLocal();
          if(V.name==='home'||V.name==='library')render(false);
        }else if(S.updated>remote.updated){dirty=true;flush();}
      }else if(S.updated>0){dirty=true;flush();}
      sync='synced';
      updateNote();
    }).catch(function(){sync='local';updateNote();});
  }catch(e){}
}

/* ---------- Helpers ---------- */
function byId(id){for(var i=0;i<THINKERS.length;i++){if(THINKERS[i].id===id)return THINKERS[i];}return null;}
function indexOf(id){for(var i=0;i<THINKERS.length;i++){if(THINKERS[i].id===id)return i;}return 0;}
function tintOf(t){var L=LAYOUT[t.id];return TINTS[(L?L.lane:0)%TINTS.length];}
function tintStyle(t){var c=tintOf(t);return '--tint:'+c.tint+';--tint-ink:'+c.ink+';--solid:'+c.solid+';';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
function dateKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function isSeen(id){return S.seen.indexOf(id)>-1;}
function markSeen(id){if(!isSeen(id))S.seen.push(id);}
function nextUnseen(exclude){
  for(var i=0;i<THINKERS.length;i++){if(!isSeen(THINKERS[i].id)&&THINKERS[i].id!==exclude)return THINKERS[i];}
  return null;
}
function otherThinker(exclude){
  var n=nextUnseen(exclude);
  if(n)return n;
  var pool=THINKERS.filter(function(t){return t.id!==exclude;});
  return pool[Math.floor(Math.random()*pool.length)];
}
function ensureDay(){
  var k=dateKey();
  if(!S.day||S.day.date!==k){
    var t=nextUnseen(null)||THINKERS[Math.floor(Date.now()/864e5)%THINKERS.length];
    S.day={date:k,id:t.id,finished:false,bonus:0};
    saveLocal();
  }
}
function greeting(){var h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening';}
function dateLabel(){return new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}

function isLiving(t){return /^b\./i.test(t.years)||/(–|-)\s*$/.test(t.years)||/present/i.test(t.years);}
function persona(t){
  var books=(t.books||[]).map(function(b){return b.t;}).join('; ');
  var terms=(t.terms||[]).map(function(x){return x.w+' ('+x.d+')';}).join('; ');
  var base='Context: the person is an architect and planning commissioner who reads philosophy in short daily sessions. They are not an academic. Use plain, concrete language and the occasional analogy from buildings, cities or everyday life.\n'+
  'Ground everything in '+t.name+'’s actual ideas'+(books?' and works ('+books+')':'')+'. Key ideas: '+t.idea+' '+(terms?'Key terms: '+terms+'. ':'')+(t.pb?'Known criticisms: '+t.pb+' ':'')+'\n'+
  'Rules: Reply in about 60 to 120 words. Respond to what they actually wrote, quoting their words back where useful. Offer one honest push, test or complication, not flattery. End with exactly one question. Do not invent quotations, dates or events. If you are unsure whether a claim is historically accurate, say so. If they ask about modern things, reason from your principles and say you are extrapolating. Do not use lists or headings. If the person seems to be in real distress, step out of the role briefly and respond with care.\n'+
  'You opened the conversation by asking: "'+t.question+'"';
  if(isLiving(t)){
    return 'You are a thoughtful guide to the ideas of '+t.name+' ('+t.title+'), a contemporary thinker. Do NOT speak as them or in the first person as them. Speak as yourself in the third person ("'+shortName(t)+' would argue..."), clearly marking where you are interpreting.\n'+base;
  }
  var v=VOICE[t.id]?'Voice: '+VOICE[t.id]+'\n':'Voice: speak the way this thinker wrote, in your own plain words, without pastiche or fake archaic language.\n';
  return 'You are an imitation of '+t.name+' ('+t.years+', '+t.place+'), known for the idea: '+t.title+'. Speak in the first person as '+t.name+', as they might in conversation, in modern English. You are an AI imitation grounded in their ideas, not their real words.\n'+v+base;
}
function chatOf(id){if(!S.chats[id])S.chats[id]=[];return S.chats[id];}
function hasTalked(id){var c=S.chats[id];return !!(c&&c.some(function(m){return m.r==='u';}));}
function sendChat(text){
  var t=byId(V.id);text=String(text||'').trim();
  if(!text||V.busy)return;
  var c=chatOf(t.id);
  c.push({r:'u',t:text.slice(0,2000)});
  if(c.length>60)c.splice(0,c.length-60);
  V.draft='';V.busy=true;V.err=null;persist();render(false);scrollChat();
  var msgs=c.filter(function(m){return !m.o;}).slice(-20).map(function(m){return {role:m.r==='u'?'user':'assistant',content:m.t};});
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  askAI(persona(t),msgs).then(function(reply){
    chatOf(t.id).push({r:'a',t:String(reply||'').trim()||'…'});
    V.busy=false;persist();if(V.name==='chat'&&V.id===t.id){render(false);scrollChat();}
  }).catch(function(e){
    V.busy=false;V.err=(e&&e.message)||'Something went wrong.';
    if(V.name==='chat'&&V.id===t.id){render(false);scrollChat();}
  });
}
function scrollChat(){setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);},30);}
function openChat(id,from,seedNote){
  var t=byId(id),c=chatOf(id);
  if(!c.length)c.push({r:'a',o:1,t:t.question});
  V={name:'chat',id:id,from:from||'detail',draft:'',busy:false,err:null};
  render(true);scrollChat();
  if(seedNote&&!hasTalked(id)){var n=String(S.notes[id]||'').trim();if(n)V.draft=n;render(false);}
}

  var t=byId(V.id),c=chatOf(t.id),living=isLiving(t);

  }).join('');
  if(V.busy)bubbles+='<div class="bub them" style="'+tintStyle(t)+'"><span class="who">'+esc(shortName(t))+'</span><span class="dots3" aria-label="Thinking"><i></i><i></i><i></i></span></div>';

  else if(!HASKEY)gate='<div class="panel"><p class="eyebrow">One step first</p><p class="body" style="margin-top:6px">Add your Anthropic API key to start talking.</p><button type="button" class="btn secondary" style="margin-top:10px" data-act="go" data-to="settings">Open Settings</button></div>';
  var err=V.err?'<p class="note" role="alert" style="color:#B3261E">'+esc(V.err)+'</p>':'';
  var can=NATIVE&&HASKEY&&!V.busy;
  var disc=living?'This is an AI guide explaining '+t.name+'’s ideas. It is not them and does not speak for them.':'This is an AI imitation, built from '+t.name+'’s ideas and books. It is not their real words.';
  return '<div class="hero" style="'+tintStyle(t)+'"><button type="button" class="back" data-act="go" data-to="'+back+'" data-id="'+t.id+'">'+icoBack()+'Back</button>'+
    '<p class="eyebrow">Conversation</p><h1>'+esc(t.name)+'</h1><p class="years">'+esc(t.title)+'</p></div>'+
    '<div class="stack"><p class="note">'+esc(disc)+'</p>'+gate+'<div class="chat" id="chatlist" aria-live="polite">'+bubbles+'</div>'+err+'</div>'+
    '<div class="dock chatdock"><textarea id="chatin" rows="2" placeholder="Answer, argue, or ask back." aria-label="Your message">'+esc(V.draft||'')+'</textarea>'+
    '<button type="button" class="btn" data-act="send"'+(can?'':' disabled')+'>Send</button></div>';
}

var libQuery='';
function fold(x){return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
var HAY={};
function hay(t){
  if(!HAY[t.id]){
    var L=LAYOUT[t.id];
    HAY[t.id]={name:fold(t.name+' '+shortName(t)),all:fold([t.name,t.years,t.place,t.title,L.era,SHEETS[L.sheet],LANES[L.lane],t.idea,t.analogy,t.why,(t.deeper||[]).join(' '),
      (t.terms||[]).map(function(x){return x.w+' '+x.d;}).join(' '),(t.books||[]).map(function(x){return x.t;}).join(' ')].join(' '))};
  }
  return HAY[t.id];
}
function libRow(t){
  var met=isSeen(t.id),p=pieces(t.id),n=0;
  PIECES.forEach(function(k){if(p[k[0]])n++;});
  return '<button type="button" class="row'+(met?'':' unmet')+'" style="'+tintStyle(t)+'" data-act="open" data-id="'+t.id+'" data-from="library">'+
    '<span class="art">'+glyph(t.id,'still')+'</span>'+
    '<span style="flex:1;min-width:0"><span class="name">'+esc(t.name)+'</span><span class="sub">'+(met?esc(t.title)+' · '+n+' of 4 built':'Not met yet · '+esc(t.years))+'</span></span>'+icoNext()+'</button>';
}
function libRows(q){
  var toks=fold(q).split(/\s+/).filter(Boolean);
  if(!toks.length){
    var out='';
    SHEETS.forEach(function(nm,si){
      var list=THINKERS.filter(function(t){return LAYOUT[t.id].sheet===si;}).sort(function(a,b){return LAYOUT[a.id].sort-LAYOUT[b.id].sort;});
      out+='<p class="eyebrow plain" style="margin-top:6px">'+esc(nm)+' · '+list.length+'</p>'+list.map(libRow).join('');
    });
    return {html:out,count:THINKERS.length};
  }
  var hits=THINKERS.filter(function(t){var h=hay(t);return toks.every(function(k){return h.all.indexOf(k)>-1;});});
  hits.sort(function(a,b){
    var an=toks.every(function(k){return hay(a).name.indexOf(k)>-1;})?0:1;
    var bn=toks.every(function(k){return hay(b).name.indexOf(k)>-1;})?0:1;
    return an-bn||LAYOUT[a.id].sort-LAYOUT[b.id].sort;
  });
  if(!hits.length)return {html:'<p class="body muted">No thinker matches. Try a name, a place, an idea like "stoic", or a book title.</p>',count:0};
  return {html:hits.map(libRow).join(''),count:hits.length};
}
function libCountText(r){return libQuery.trim()?(r.count+(r.count===1?' result':' results')):('All '+THINKERS.length+' thinkers, grouped by era');}
function viewLibrary(){
  var r=libRows(libQuery);
  return '<div class="stack"><div><p class="greet">Library</p><h1 class="title">Find a thinker</h1></div>'+
    '<div class="searchbox"><input id="libq" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search name, idea, place or book" aria-label="Search the library" value="'+esc(libQuery)+'"></div>'+
    '<p class="note" id="libcount" role="status">'+esc(libCountText(r))+'</p>'+
    '<div class="stack tight" id="librows">'+r.html+'</div><p class="note" id="syncnote">'+esc(syncText())+'</p></div>'+tabbar('library');
}

function viewMap(){
  var si=mapSheet,list=THINKERS.filter(function(t){return LAYOUT[t.id].sheet===si;}).sort(function(a,b){return LAYOUT[a.id].sort-LAYOUT[b.id].sort;});
  var pos={},row=-1,used={},rowEra=[],rowStart=0;
  list.forEach(function(t){var L=LAYOUT[t.id];if(row<0||used[L.lane]||L.sort-rowStart>80){row++;used={};rowEra[row]=L.era;rowStart=L.sort;}used[L.lane]=1;pos[t.id]=row;});
  var nrows=row+1;
  var W=392,GX=54,GW=W-GX-6,R=18;
  function lx(l){return GX+GW/3*(l+0.5);}
  function ly(r){return 128+r*96;}
  var lastY=ly(nrows-1),bt=lastY+74,H=bt+60;
  var built=builtCount(),total=THINKERS.length*PIECES.length;
  var metHere=list.filter(function(t){return isSeen(t.id);}).length;
  var svg='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#1B1B2F"/></marker></defs>';
  var l;
  for(l=0;l<3;l++){
    var x=lx(l);
    svg+='<line x1="'+x+'" y1="72" x2="'+x+'" y2="'+(lastY+62)+'" stroke="#D9D3C6" stroke-width="1" stroke-dasharray="4 5"/>';
    svg+='<circle cx="'+x+'" cy="26" r="12" fill="none" stroke="#1B1B2F" stroke-width="1.5"/><text x="'+x+'" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1B2F">'+'ABC'.charAt(l)+'</text>';
    svg+='<text x="'+x+'" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#5A5A70">'+esc(LANES[l])+'</text>';
  }
  rowEra.forEach(function(era,i){
    var y=ly(i);
    svg+='<line x1="'+(GX-6)+'" y1="'+y+'" x2="'+(W-4)+'" y2="'+y+'" stroke="#F0ECE2" stroke-width="1"/>';
    svg+='<text x="4" y="'+(y+4)+'" font-size="11" font-weight="500" fill="#5A5A70">'+esc(era)+'</text>';
  });
  EDGES.forEach(function(e){
    if(pos[e.a]===undefined||pos[e.b]===undefined)return;
    var ma=isSeen(e.a),mb=isSeen(e.b);
    var A=LAYOUT[e.a],B=LAYOUT[e.b];
    var same=pos[e.a]===pos[e.b],dir=A.lane<B.lane?1:-1;
    var x1=same?lx(A.lane)+dir*R:lx(A.lane),y1=same?ly(pos[e.a]):ly(pos[e.a])+R,x2=same?lx(B.lane)-dir*(R+(e.type==='arrow'&&ma&&mb?5:1)):lx(B.lane),y2=same?ly(pos[e.b]):ly(pos[e.b])-R-(e.type==='arrow'&&ma&&mb?5:1);
    var d=same?'M'+x1+' '+y1+' L'+x2+' '+y2:x1===x2?'M'+x1+' '+y1+' L'+x2+' '+y2:'M'+x1+' '+y1+' C'+x1+' '+(y1+(y2-y1)*0.55)+' '+x2+' '+(y2-(y2-y1)*0.55)+' '+x2+' '+y2;
    if(!(ma&&mb)){
      if(!(ma||mb))return;
      svg+='<path d="'+d+'" fill="none" stroke="#B9B2A2" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>';
      return;
    }
    svg+='<path d="'+d+'" fill="none" stroke="#1B1B2F" stroke-width="1.6"'+(e.type==='dash'?' stroke-dasharray="6 5"':'')+(e.type==='arrow'?' marker-end="url(#ah)"':'')+'/>';
  });
  list.forEach(function(t){
    var L=LAYOUT[t.id],x=lx(L.lane),y=ly(pos[t.id]),c=tintOf(t),p=pieces(t.id),met=isSeen(t.id);
    var n=0;PIECES.forEach(function(k){if(p[k[0]])n++;});
    svg+='<g class="node" role="button" tabindex="0" data-act="open" data-id="'+t.id+'" data-from="map" aria-label="'+esc(t.name)+', '+(met?n+' of 4 pieces built':'not met yet')+'">';
    if(met){
      svg+='<circle class="hit" cx="'+x+'" cy="'+y+'" r="'+R+'" fill="'+c.tint+'" stroke="'+c.solid+'" stroke-width="2.5"/>';
      svg+='<g class="glyph" style="color:'+c.ink+';--solid:'+c.solid+'" transform="translate('+(x-14)+' '+(y-14)+') scale(0.4375)">'+GLYPHS[t.id]+'</g>';
    }else{
      svg+='<circle class="hit" cx="'+x+'" cy="'+y+'" r="'+R+'" fill="#fff" stroke="#CFC8B8" stroke-width="2" stroke-dasharray="4 4"/>';
      svg+='<g class="glyph" style="color:#8A8A9C;--solid:#B9B2A2" opacity="0.55" transform="translate('+(x-14)+' '+(y-14)+') scale(0.4375)">'+GLYPHS[t.id]+'</g>';
    }
    svg+='<text x="'+x+'" y="'+(y+37)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+(met?'#1B1B2F':'#6E6E82')+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+esc(shortName(t))+'</text>';
    var x0=x-22.5;
    PIECES.forEach(function(k,j){
      var on=met&&p[k[0]];
      svg+='<rect x="'+(x0+j*12)+'" y="'+(y+43)+'" width="9" height="9" rx="2" fill="'+(on?c.solid:'#fff')+'" stroke="'+(on?c.solid:(met?'#9A9AAA':'#D5CFC2'))+'" stroke-width="1.5"/>';
    });
    svg+='</g>';
  });
  svg+='<rect x="1.5" y="'+bt+'" width="389" height="56" fill="#fff" stroke="#1B1B2F" stroke-width="1.5"/><line x1="236" y1="'+bt+'" x2="236" y2="'+(bt+56)+'" stroke="#1B1B2F" stroke-width="1.5"/>';
  svg+='<text x="12" y="'+(bt+22)+'" font-size="12" font-weight="700" fill="#1B1B2F">SHEET A-0'+(si+1)+' · '+esc(SHEETS[si].toUpperCase())+'</text><text x="12" y="'+(bt+43)+'" font-size="12" font-weight="500" fill="#5A5A70">'+metHere+' of '+list.length+' thinkers met</text>';
  svg+='<text x="248" y="'+(bt+22)+'" font-size="11" font-weight="700" fill="#5A5A70">PIECES BUILT (ALL SHEETS)</text><text x="248" y="'+(bt+45)+'" font-size="20" font-weight="700" fill="#1B1B2F">'+built+' / '+total+'</text>';
  var tabs='<div class="sheets" role="group" aria-label="Choose a sheet">'+SHEETS.map(function(nm,i){return '<button type="button" data-act="sheet" data-k="'+i+'" aria-pressed="'+(i===si?'true':'false')+'">'+esc(nm)+'</button>';}).join('')+'</div>';
  var legend='<div class="legend">'+PIECES.map(function(k){return '<span><i class="on"></i>'+k[1]+'</span>';}).join('')+'<span><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="#1B1B2F" stroke-width="1.6"/></svg>Shaped</span><span><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="#1B1B2F" stroke-width="1.6" stroke-dasharray="6 5"/></svg>Disagreed</span><span><svg width="26" height="8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#B9B2A2" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/></svg>Link not drawn yet</span></div>';
  return '<div class="stack"><div><p class="greet">Map</p><h1 class="title">'+built+' of '+total+' pieces built</h1></div>'+
    '<p class="body muted">Five drawing sheets, one per era. Links between thinkers on different sheets show up on their pages. Pencil dots become real lines once you have met both thinkers.</p>'+
    tabs+legend+
    '<div class="mapwrap"><svg class="mapsvg" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Map of thinkers by theme and date">'+svg+'</svg></div></div>'+tabbar('map');
}

    conn+
    '<div class="panel dark"><p class="eyebrow">For today</p><p class="q">'+esc(t.question)+'</p></div>'+
    '<div><label class="lbl" for="note">Your note</label><textarea id="note" placeholder="Write what you thought.">'+esc(S.notes[t.id]||'')+'</textarea><p class="note" id="notestatus" role="status" style="margin-top:6px">'+esc(noteStatus(t.id))+'</p></div>'+talkBlock+'</div>'+tabbar(backTo);
}

/* ---------- Render and events ---------- */
var mapSheet=0;
var app=document.getElementById('app');
function render(focus){
  var keepY=window.pageYOffset||0;
  ensureDay();
  var html,flow=false;
  switch(V.name){
    case 'card':html=viewCard();flow=true;break;
    case 'deeper':html=viewDeeper();flow=true;break;
    case 'chat':html=viewChat();flow=true;break;
    case 'settings':html=viewSettings();break;
    case 'done':html=viewDone();break;
    case 'library':html=viewLibrary();break;
    case 'map':html=viewMap();break;
    case 'detail':html=viewDetail();break;
    default:html=viewHome();
  }
  app.className=flow?'flow':'';
  app.innerHTML=html;
  if(focus){
    var h=app.querySelector('h1');
    if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){}}
    window.scrollTo(0,0);
  }else{
    window.scrollTo(0,keepY);
  }
}
function go(v){V={name:v};render(true);}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  var d=b.dataset;
  switch(d.act){
    case 'go':
      if(d.to==='detail'&&d.id){V={name:'detail',id:d.id,from:'library'};render(true);}
      else if(d.to==='done'&&!S.day.finished){go('home');}else{go(d.to);}
      break;
    case 'start':V={name:'card',id:S.day.id,step:0,mode:'main'};render(true);break;
    case 'next':V.step=Math.min(2,V.step+1);render(true);break;
    case 'prev':V.step=Math.max(0,V.step-1);render(true);break;
    case 'exit':
      if(V.mode==='free'){V={name:'detail',id:V.id,from:'library'};render(true);}
      else go(V.mode==='bonus'?'done':'home');
      break;
    case 'meetNow':V={name:'card',id:d.id,step:0,mode:'free'};render(true);break;
    case 'finish':
      markSeen(V.id);
      if(V.mode==='main')S.day.finished=true;
      persist();
      if(V.mode==='free'){V={name:'detail',id:V.id,from:'map'};render(true);break;}
      go('done');
      break;
    case 'bonusMeet':
      if(S.day.bonus>=2)return;
      var t=otherThinker(S.day.id);
      S.day.bonus++;persist();
      V={name:'card',id:t.id,step:0,mode:'bonus'};render(true);
      break;
    case 'bonusTalk':
      if(S.day.bonus>=2)return;
      S.day.bonus++;persist();
      openChat(S.day.id,'done',true);
      break;
    case 'chat':openChat(d.id,d.from,!!d.seed);break;
    case 'send':var ci=document.getElementById('chatin');sendChat(ci?ci.value:V.draft);break;
    case 'saveKey':
      var ki=document.getElementById('keyin');
      if(ki&&ki.value.trim()){nativePost({type:'setKey',key:ki.value.trim()});ki.value='';}
      break;
    case 'delKey':nativePost({type:'delKey'});break;
    case 'bonusDeeper':
      if(S.day.bonus>=2)return;
      S.day.bonus++;
      if(S.deeper.indexOf(S.day.id)<0)S.deeper.push(S.day.id);
      persist();
      V={name:'deeper',id:S.day.id};render(true);
      break;
    case 'sheet':mapSheet=parseInt(d.k,10)||0;render(false);break;
    case 'open':if(d.from==='map'&&LAYOUT[d.id])mapSheet=LAYOUT[d.id].sheet;V={name:'detail',id:d.id,from:d.from};render(true);break;
    case 'markDeeper':
      if(S.deeper.indexOf(V.id)<0){S.deeper.push(V.id);persist();}
      render(false);
      break;
  }
});
app.addEventListener('input',function(e){
  if(e.target&&e.target.id==='chatin'){V.draft=e.target.value;}
  if(e.target&&e.target.id==='libq'){
    libQuery=e.target.value;
    var r=libRows(libQuery);
    document.getElementById('librows').innerHTML=r.html;
    document.getElementById('libcount').textContent=libCountText(r);
  }
});
app.addEventListener('keydown',function(e){
  var el=e.target;
  if((e.key==='Enter'||e.key===' ')&&el&&el.getAttribute&&el.getAttribute('role')==='button'&&el.getAttribute('data-act')){
    e.preventDefault();
    el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  }
});
function saveNote(e){
  if(e.target&&e.target.id==='note'&&V.id){
    if(S.notes[V.id]!==e.target.value){
      S.notes[V.id]=e.target.value;
      persist();
    }
    var n=document.getElementById('notestatus');
    if(n)n.textContent=noteStatus(V.id);
  }
}
app.addEventListener('input',saveNote);
app.addEventListener('change',saveNote);
app.addEventListener('focusout',saveNote);

render(true);
initRemote();
})();
</script>
</body>
</html>
