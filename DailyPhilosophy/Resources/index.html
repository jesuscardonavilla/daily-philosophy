<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Philosophy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* Layout idea: a single phone-width column. A tinted hero block on top, one finite card below, a docked action at the bottom. */
:root{
  --bg:#F7F4EE;
  --outer:#EAE5DA;
  --ink:#1B1B2F;
  --muted:#5A5A70;
  --line:#E4DFD3;
  --card:#FFFFFF;
  --violet:#6B5CE7;
  --tint:#DCD6FF;
  --tint-ink:#4B3FC4;
  --solid:#6B5CE7;
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
#app{max-width:440px;min-height:100%;margin:0 auto;background:var(--bg);padding:28px 24px 108px;position:relative}
#app.flow{padding-bottom:24px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
h1:focus{outline:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tint-ink)}
.eyebrow.plain{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.stack.tight{gap:10px}

.greet{font-size:14px;font-weight:500;color:var(--muted)}
.title{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-top:6px}

.tile{background:var(--tint);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.tile h2{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.tile .sub{font-size:17px;font-weight:500}
.tile .meta{font-size:14px;font-weight:500;color:var(--tint-ink);margin-top:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:28px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);min-height:48px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}

.met{display:flex;flex-direction:column;gap:10px}
.dots{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:4px}
.dots span{height:8px;border-radius:4px;background:var(--line)}

.hero{position:relative;background:var(--tint);margin:-28px -24px 24px;padding:12px 24px 24px;border-radius:0 0 32px 32px;display:flex;flex-direction:column;gap:6px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--tint-ink);cursor:pointer;align-self:flex-start}
.hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.hero .years{font-size:15px;font-weight:500;color:var(--tint-ink)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.segs span{height:8px;border-radius:4px;background:rgba(255,255,255,.7)}
.segs span.on{background:var(--solid)}

.lead{font-size:19px;line-height:1.4;font-weight:500}
.h2{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.panel{background:var(--card);border-radius:18px;padding:16px 18px}
.panel.big{font-size:22px;line-height:1.35;font-weight:500;padding:22px 20px}
.panel.dark{background:var(--ink);color:#fff}
.panel.dark .eyebrow{color:#C9C2FF}
.panel p.q{font-size:20px;line-height:1.35;font-weight:500;margin-top:6px}
.body{font-size:17px;line-height:1.5;font-weight:500}

label.lbl{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:104px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;font-family:inherit;font-size:16px;line-height:1.4;color:var(--ink);resize:vertical}
textarea:focus-visible{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(107,92,231,.25)}

.dock{position:sticky;bottom:0;margin:24px -24px 0;padding:14px 24px 20px;background:linear-gradient(to top,var(--bg) 72%,rgba(247,244,238,0));display:grid;grid-template-columns:1fr;gap:10px}
.dock.two{grid-template-columns:1fr 1.4fr}

.check{width:64px;height:64px;border-radius:32px;background:#F5C542;display:flex;align-items:center;justify-content:center}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:10px 18px;border:0;border-radius:16px;background:var(--tint);font-size:17px;font-weight:700;text-align:left;cursor:pointer}
.opt small{font-size:13px;font-weight:700;color:var(--tint-ink);flex:none}

.row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px;border:0;border-radius:18px;background:var(--tint);text-align:left;cursor:pointer}
.row .name{display:block;font-size:18px;font-weight:700;line-height:1.2}
.row .sub{display:block;font-size:14px;font-weight:500;color:var(--tint-ink);margin-top:2px}
.row .dot{width:14px;height:14px;border-radius:7px;background:var(--solid);flex:none}
.row.locked{background:transparent;border:2px dashed #CFC8B8;cursor:default;color:var(--muted)}
.row.locked .name{font-weight:500;font-size:16px}

.answer{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:500;text-align:left;cursor:pointer}
.answer.right{border-color:#1F9D8A;background:#E3F6F1}
.answer.wrong{border-color:#B5391C;background:#FFEAE3}
.answer[disabled]{cursor:default}
.answer .mark{margin-left:auto;font-size:13px;font-weight:700}

.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,440px);display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-top:1px solid var(--line);padding:6px 24px calc(10px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding:6px;border:0;background:transparent;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--muted)}
.glyph{display:block;color:var(--tint-ink);overflow:visible}
.glyph .s{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.glyph .w{fill:#fff}
.glyph .f{fill:var(--solid)}
.glyph .fi{fill:currentColor}
.art svg{width:100%;height:100%}
.hero .art{position:absolute;right:20px;top:58px;width:96px;height:96px}
.hero.withart .eyebrow,.hero.withart h1,.hero.withart .years{padding-right:108px}
.tile{position:relative}
.tile .art{position:absolute;right:16px;top:16px;width:84px;height:84px}
.tile.hasart .eyebrow,.tile.hasart h2,.tile.hasart .sub,.tile.hasart .meta{padding-right:92px}
.row .art{display:block;width:46px;height:46px;flex:none}
.row.unmet{background:#fff;border:2px dashed #CFC8B8}
.row.unmet .art{opacity:.6}
.row.unmet .sub{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
.k-wob{animation:wob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.k-pulse,.k-core{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.k-sh{animation:shx 3.2s ease-in-out infinite alternate}
@keyframes shx{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
.k-fire{animation:fire .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fire{from{transform:scale(.85,.8)}to{transform:scale(1.1,1.2)}}
.k-slide{animation:slide 2.2s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.k-arrow{animation:arrow 1.8s ease-in infinite}
@keyframes arrow{0%{transform:translateX(0);opacity:1}80%{transform:translateX(14px);opacity:1}100%{transform:translateX(14px);opacity:0}}
.k-wind{animation:wind 1.4s linear infinite}
@keyframes wind{to{stroke-dashoffset:-20}}
.k-drop{animation:drop 1.4s linear infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.k-sandtop{animation:sandtop 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sandtop{from{transform:scaleY(1)}to{transform:scaleY(.2)}}
.k-sandbot{animation:sandbot 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sandbot{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.k-step{animation:step 3s ease-in-out infinite}
@keyframes step{0%,100%{opacity:.15}20%,60%{opacity:1}}
.k-wave{animation:wave 2.6s linear infinite}
@keyframes wave{to{transform:translateX(-20px)}}
.k-r1,.k-r2,.k-r3{animation:ring 3s ease-in-out infinite}
.k-r2{animation-delay:.4s}
.k-r3{animation-delay:.8s}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.15}}
.k-rise{animation:rise2 4s ease-out infinite}
@keyframes rise2{0%{transform:translateY(26px)}60%,100%{transform:translateY(0)}}
.k-spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.k-roam{animation:roam 5s ease-in-out infinite}
@keyframes roam{0%,100%{transform:translate(0,0)}33%{transform:translate(11px,-7px)}66%{transform:translate(-5px,9px)}}
.k-boulder{animation:push 3.6s ease-in infinite}
@keyframes push{0%{transform:translate(0,0);opacity:1}85%{transform:translate(30px,-19.6px);opacity:1}100%{transform:translate(30px,-19.6px);opacity:0}}
.k-roll{animation:spin 3.6s linear infinite;transform-box:fill-box;transform-origin:center}
.k-bob{animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.k-flap{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
.k-grow{animation:grow 3.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{0%{transform:scale(.2)}60%,100%{transform:scale(1)}}
.k-breath{animation:breath 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes breath{from{transform:scale(.92)}to{transform:scale(1.08)}}
.k-beat{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.1)}}
.k-needle{animation:needle 3s ease-in-out infinite alternate}
@keyframes needle{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.k-swing{animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.k-sway{animation:sway 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sway{from{transform:rotate(-8deg) translateX(-2px)}to{transform:rotate(8deg) translateX(3px)}}
.k-blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.k-climb{animation:climb 4s ease-in-out infinite}
@keyframes climb{0%,8%{transform:translate(0,0);opacity:1}35%{transform:translate(13px,-13px)}62%{transform:translate(26px,-26px)}90%{transform:translate(39px,-39px);opacity:1}100%{transform:translate(39px,-39px);opacity:0}}
.k-leap{animation:leap 2.6s ease-in-out infinite}
@keyframes leap{0%,10%{transform:translate(0,0);opacity:1}55%{transform:translate(15px,-15px)}90%{transform:translate(30px,2px);opacity:1}100%{transform:translate(30px,2px);opacity:0}}
.k-spin2{animation:spin2 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin2{to{transform:rotate(-360deg)}}
}
.still *,.mapsvg *{animation:none!important}
.searchbox input{width:100%;min-height:52px;border:2px solid #1B1B2F;border-radius:14px;background:#fff;padding:0 16px;font:inherit;font-size:16px;color:#1B1B2F}
.searchbox input:focus{outline:3px solid #6B5CE7;outline-offset:2px}
.sheets{display:flex;gap:6px;flex-wrap:wrap}
.sheets button{border:1.5px solid #1B1B2F;background:#fff;border-radius:999px;padding:8px 14px;min-height:40px;font:inherit;font-size:14px;font-weight:600;color:#1B1B2F;cursor:pointer}
.sheets button[aria-pressed=true]{background:#1B1B2F;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;background:rgba(255,255,255,.55);color:var(--tint-ink)}
.chip i{width:10px;height:10px;border-radius:2px;border:2px solid var(--solid);display:inline-block}
.chip.on{background:#fff}
.chip.on i{background:var(--solid)}
.mapwrap{background:#fff;border-radius:18px;padding:6px;border:1px solid var(--line)}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg text{font-family:var(--font)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle.hit{stroke:#1B1B2F;stroke-width:3.5}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;font-weight:500;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid #7A7A90}
.legend i.on{background:#7A7A90}
.links{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.links b{display:block;font-size:16px}
.links span{display:block;font-size:15px;line-height:1.35;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:no-preference){.tile,.panel{animation:rise .25s ease-out}}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

.bub{max-width:88%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.45;margin:0 0 10px}
.bub.me{margin-left:auto;background:var(--ink,#1B1B2F);color:#fff;border-bottom-right-radius:6px}
.bub.them{background:var(--tint,#EEE);color:var(--ink,#1B1B2F);border-bottom-left-radius:6px}
.bub .who{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.chat{display:flex;flex-direction:column;padding-bottom:8px}
.chatdock{grid-template-columns:1fr auto;align-items:end}
.chatdock textarea{min-height:52px;max-height:140px}
.chatdock .btn{width:auto;min-width:84px}
.textin{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:16px;background:#fff}
.dots3 i{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:currentColor;opacity:.4}
@media (prefers-reduced-motion:no-preference){.dots3 i{animation:dp3 1s infinite ease-in-out}.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}@keyframes dp3{50%{opacity:1}}}
.btn:disabled{opacity:.45}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- Content ---------- */
var TINTS=[
  {tint:'#DCD6FF',ink:'#4B3FC4',solid:'#6B5CE7'},
  {tint:'#CDEFE6',ink:'#0B6B5D',solid:'#1F9D8A'},
  {tint:'#FFD9CC',ink:'#B5391C',solid:'#F26B4E'},
  {tint:'#FFE9A8',ink:'#7A5A00',solid:'#E5B418'}
];

var THINKERS=[
{id:'socrates',name:'Socrates',years:'c. 470–399 BCE',place:'Athens',title:'The examined life',
 idea:'Socrates spent his days in Athens asking people what they meant by words like justice, courage and piety, and found that they often could not say. He argued that admitting what you do not know is where wisdom starts, and that a life you never question is not fully your own.',
 analogy:'A mechanic who asks why the engine makes that noise, instead of turning up the radio.',
 question:'What word do you use all the time and could not define if someone asked?',
 deeper:['Socrates wrote nothing down. What we know of him comes mostly from his student Plato, and also from Xenophon and the playwright Aristophanes, who do not always agree with each other.','His method was to ask short questions until a confident claim ran into its own contradictions. In 399 BCE an Athenian jury convicted him of impiety and of corrupting the young, and sentenced him to death.'],
 quiz:{q:'What was Socrates’s main method?',options:['Giving long public lectures','Asking probing questions','Writing treatises'],answer:1,why:'He questioned people until their confident claims exposed their own contradictions.'}},
{id:'plato',name:'Plato',years:'c. 428–348 BCE',place:'Athens',title:'The cave',
 idea:'Imagine people chained in a cave, facing a wall. A fire behind them throws shadows of passing objects onto it. Shadows are all they have ever seen, so they take them for reality. Plato used the picture to ask how much of what we call reality is only the version we have been shown.',
 analogy:'Knowing the ocean only from photos. The photos are not lies, but they are not the sea. You have to stand in it.',
 question:'What is one thing you believe only because it is the version you have always been shown?',
 deeper:['The story appears in the Republic, written around 375 BCE. One prisoner is freed, climbs out, and is dazzled by the sun. When he goes back to tell the others, they think the trip has damaged him.','Plato believed the things we see are copies of deeper, unchanging Forms, such as Justice or Beauty itself, and that philosophy is the slow climb out of the cave toward them. He founded the Academy in Athens, which ran for centuries.'],
 quiz:{q:'In the allegory, what do the prisoners see?',options:['Shadows on a wall','The sun','Their own reflections'],answer:0,why:'They have only ever seen shadows, so they treat shadows as the real world.'}},
{id:'aristotle',name:'Aristotle',years:'384–322 BCE',place:'Athens',title:'Virtue is a habit',
 idea:'Aristotle held that goodness is not a feeling or a rulebook but a trained habit. You become brave by doing brave things, and fair by acting fairly. Each virtue also sits between two extremes: courage lies between cowardice and recklessness.',
 analogy:'Learning guitar. Nobody becomes musical by reading about it. You practice until the right move is the easy one.',
 question:'Which habit are you practicing every day without having chosen it?',
 deeper:['Aristotle called a flourishing life eudaimonia, often translated as happiness, though “living well” is closer. He argued it comes from using your abilities well over a whole lifetime, not from one good moment.','His middle path is not an average. The right amount of anger or generosity depends on the situation, and judging it is a skill he called practical wisdom. He set this out in the Nicomachean Ethics, and he was once the tutor of Alexander the Great.'],
 quiz:{q:'Where does Aristotle place a virtue?',options:['Between two extremes','In strict obedience to rules','In avoiding all pleasure'],answer:0,why:'Courage, for example, sits between cowardice and recklessness.'}},
{id:'epictetus',name:'Epictetus',years:'c. 50–135 CE',place:'Rome and Nicopolis',title:'What is up to you',
 idea:'Epictetus was born a slave and became one of the most influential Stoic teachers. His core move was to sort everything into what is up to us, such as our judgments, choices and effort, and what is not, such as other people’s actions, our reputation, or how things turn out. Peace comes from spending effort only on the first group.',
 analogy:'An archer controls the aim and the release, but not the wind or whether the target moves.',
 question:'What is worrying you right now, and which part of it is actually up to you?',
 deeper:['Epictetus did not write his teachings down. His student Arrian recorded them in the Discourses and condensed them into a short Handbook.','He lived in Rome and later taught in Nicopolis, in Greece. Stoicism does not ask you to stop caring about outcomes. It asks you to act well, and then accept what was never in your control.'],
 quiz:{q:'Which of these is fully up to us, for Epictetus?',options:['Our reputation','Our own judgments','The weather'],answer:1,why:'Judgments and choices are ours. Reputation and outcomes depend on others and on events.'}},
{id:'seneca',name:'Seneca',years:'c. 4 BCE–65 CE',place:'Rome',title:'Time is what you spend',
 idea:'In On the Shortness of Life, Seneca argues that life is long enough if you do not waste it. People guard their money carefully but hand over their hours to anyone who asks, and then complain that life is short.',
 analogy:'A bank account that anyone could draw from without asking. You would notice quickly with money. Hours leave just as quietly.',
 question:'Where did your last free hour go, and did you choose that?',
 deeper:['Seneca was a Roman Stoic, a playwright, and for years an adviser to the emperor Nero. He wrote On the Shortness of Life as a letter to a friend who held a government post.','He argued that the cure is not to fill every minute, but to decide what deserves your time and protect it. He fell out of favor with Nero and died in 65 CE.'],
 quiz:{q:'What does Seneca say people waste most carelessly?',options:['Their talent','Their time','Their money'],answer:1,why:'They protect their money, but give away their hours without a thought.'}},
{id:'confucius',name:'Confucius',years:'551–479 BCE',place:'China',title:'Goodness is practiced with others',
 idea:'Confucius taught that being good is not something you work out alone. It is practiced inside relationships and roles: child, friend, neighbor, ruler. Small acts of respect and care, repeated, shape character the way daily steps wear a path.',
 analogy:'A path worn into grass. Each respectful act is one more footstep that makes the next one easier.',
 question:'Who in your life is owed more of your attention than you are giving?',
 deeper:['His sayings were collected by students in the Analects. He valued learning, family loyalty and ritual, not as empty ceremony but as the way care becomes visible.','He taught that leaders should govern by example, and that a person of good character draws others in without force. The central quality he named is ren, often translated as humaneness.'],
 quiz:{q:'Where did Confucius see goodness being practiced?',options:['In everyday relationships and roles','Only in solitude','Only through strict laws'],answer:0,why:'For him, character grows through how you treat the people around you.'}},
{id:'laozi',name:'Laozi',years:'traditionally 6th century BCE',place:'China',title:'Wu wei',
 idea:'The Tao Te Ching, traditionally credited to Laozi, argues that force often backfires. Wu wei means acting in step with how things naturally flow, rather than pushing against them. Water is the model: soft, yet it wears down stone.',
 analogy:'Swimming across a current by angling with it, instead of fighting straight against it.',
 question:'Where are you forcing something that might go easier if you stopped pushing?',
 deeper:['Who Laozi was, and when he lived, is debated. Many scholars think the book grew from several sources, and the traditional date is around the 6th century BCE.','Wu wei is often mistranslated as doing nothing. It is closer to acting without strain: doing what the moment calls for, and no more. The text prizes softness, patience and humility over strength.'],
 quiz:{q:'What does wu wei suggest?',options:['Pushing harder against obstacles','Doing nothing at all','Acting in harmony without forcing'],answer:2,why:'It means working with the flow of things instead of against it.'}},
{id:'descartes',name:'Descartes',years:'1596–1650',place:'France and the Netherlands',title:'I think, therefore I am',
 idea:'Descartes decided to doubt everything he could, including his senses. Even if a deceiver tricked him about the world, the act of doubting showed that something was there doing the doubting. A thinking self exists. From that one fixed point he tried to rebuild knowledge.',
 analogy:'Clearing a cluttered room down to the bare floor, to check what the floor can actually hold.',
 question:'If you set aside everything you were only told, what would you still be sure of?',
 deeper:['He published the idea in the Discourse on Method in 1637 and developed it in the Meditations on First Philosophy in 1641. The Meditations imagine an evil demon who deceives you about everything outside your own mind.','Descartes then argued that mind and body are two different kinds of thing, a view called dualism that philosophers still argue over.'],
 quiz:{q:'What did Descartes’s doubting prove to him?',options:['That the physical world is real','That a thinking self exists','That nothing can be known'],answer:1,why:'Doubting is a kind of thinking, so something must exist that is doing it.'}},
{id:'hume',name:'David Hume',years:'1711–1776',place:'Scotland',title:'Habit, not proof',
 idea:'We expect the sun to rise tomorrow because it always has. Hume pointed out that no logic proves the future must resemble the past. Much of what we treat as knowledge rests on habit and custom, which is useful but not a guarantee.',
 analogy:'Trusting a chair because it held you yesterday. Reasonable, but yesterday did not promise anything.',
 question:'What do you treat as certain only because it has always been that way?',
 deeper:['Hume was a Scottish philosopher of the 18th century. His point about expecting the future to match the past is called the problem of induction, and it is still discussed today.','He also noted that you cannot get an “ought” from an “is”: facts about how things are do not by themselves tell you how they should be.'],
 quiz:{q:'What did Hume say our expectation that the future resembles the past rests on?',options:['Habit and custom','Pure logic','A divine guarantee'],answer:0,why:'We have seen patterns repeat, so we expect them to continue, but that is not proof.'}},
{id:'kant',name:'Immanuel Kant',years:'1724–1804',place:'Königsberg',title:'Act on rules for everyone',
 idea:'Kant proposed a test for right action: act only on a rule you could want everyone to follow. If your reason for breaking a promise would make promises meaningless once everyone did it, the rule fails. He also said to treat people as ends in themselves, never merely as tools.',
 analogy:'Splitting a cake with “I cut, you choose.” You cut fairly because you would accept the rule from the other side.',
 question:'What small exception do you make for yourself that you would object to in someone else?',
 deeper:['Kant lived in Königsberg and wrote his major works late in life, including the Critique of Pure Reason in 1781 and the Groundwork of the Metaphysics of Morals in 1785.','For him, what makes an act good is the principle behind it, not its results. That makes his view a contrast to utilitarianism, which judges acts by their outcomes.'],
 quiz:{q:'What does Kant’s test ask about your rule?',options:['Whether the outcome is pleasant','Whether everyone could follow it','Whether the law allows it'],answer:1,why:'A rule that only works when others do not follow it fails the test.'}},
{id:'mill',name:'John Stuart Mill',years:'1806–1873',place:'England',title:'The harm principle',
 idea:'Mill argued that a society should limit someone’s freedom mainly to prevent harm to others, not simply because most people dislike what that person does. He also defended open debate, because an opinion you have never had to defend is one you hold only by habit.',
 analogy:'A referee who stops fouls against other players, but does not tell you how to play your own game.',
 question:'Which of your opinions have you only ever heard defended by people who agree with you?',
 deeper:['Mill set out these ideas in On Liberty, published in 1859. He also wrote Utilitarianism, which judges actions by how much happiness they create.','He argued for women’s equality in The Subjection of Women in 1869, and served in Parliament in the 1860s.'],
 quiz:{q:'Mill said freedom may be limited mainly to prevent what?',options:['Harm to others','Offense to tradition','Disagreement'],answer:0,why:'Disliking someone’s choices is not enough. Harm to others is the line.'}},
{id:'camus',name:'Albert Camus',years:'1913–1960',place:'France and Algeria',title:'Imagine Sisyphus happy',
 idea:'In The Myth of Sisyphus, Camus says life has no built-in meaning, yet people keep demanding one. He calls this clash the absurd. His image is Sisyphus, condemned to push a boulder up a hill forever, and his claim is that we can still live fully without needing a cosmic answer.',
 analogy:'Playing a game you know will reset, and still caring how well you play it.',
 question:'What would you keep doing even if no one noticed and it never counted?',
 deeper:['Camus published the essay in 1942. He won the Nobel Prize in Literature in 1957 and is linked with existentialism, though he rejected that label.','He did not offer the absurd as a reason to despair. He argued for revolt, freedom and passion: living with the question left open, instead of escaping it.'],
 quiz:{q:'What is Camus’s image for the absurd?',options:['Plato’s cave','Sisyphus and the boulder','The thinking self'],answer:1,why:'Sisyphus keeps pushing a boulder that always rolls back, and Camus asks us to imagine him content.'}}
];

var MORE=[{id:'buddha',name:'The Buddha',years:'c. 5th century BCE',place:'Northern India',title:'The middle way',
 idea:'The Buddha, born Siddhartha Gautama, taught that life involves dissatisfaction, that it comes from craving and clinging, and that it can end. His path avoids both indulgence and harsh self-denial, and trains ethics, attention and understanding together.',
 analogy:'Tuning a string. Too tight and it snaps, too loose and it will not sound. Practice is finding the tension that plays.',
 question:'What do you keep reaching for that never feels like enough?',
 deeper:['His teaching is summed up in the Four Noble Truths: there is dissatisfaction, it has a cause, it can end, and there is a path to its end. The path has eight parts, including right view, right effort and right mindfulness.','His teachings were written down by followers after his death, so dates and details are uncertain. Many scholars place his life around the 5th century BCE, in what is now northern India and Nepal.'],
 why:'Modern mindfulness practice draws on his methods of watching thoughts and cravings without being ruled by them.',
 terms:[{w:'Dukkha',d:'Often translated as suffering. It covers dissatisfaction and unease, not only pain.'},{w:'Nirvana',d:'The ending of craving and clinging.'}],
 booksNote:'He left no writings. His teachings were remembered and written down by followers.',
 books:[{t:'Dhammapada',y:'early Buddhist verses'},{t:'The first sermon (Dhammacakkappavattana Sutta)',y:'early Buddhist text'},{t:'The Questions of King Milinda',y:'c. 100 BCE–200 CE'}],
 quiz:{q:'What does the Buddha’s “middle way” avoid?',options:['Both indulgence and harsh self-denial','All thinking','All community life'],answer:0,why:'He rejected both extremes of luxury and of severe asceticism.'}},
{id:'mencius',name:'Mencius',years:'c. 372–289 BCE',place:'China',title:'Seeds of goodness',
 idea:'Mencius argued that human nature is good at the start, like a sprout. Everyone feels a pang on seeing a child about to fall into a well. A decent environment and education let that sprout grow, while neglect and hardship stunt it.',
 analogy:'A seed does not need a plant handed to it. It needs soil, water and time.',
 question:'When did you last act kindly before you had time to think about it?',
 deeper:['Mencius followed Confucius’s teaching and is often called his most important early successor. His book, the Mencius, records his conversations with rulers and students.','He held that governments exist to serve the people, and that a ruler who fails them loses the right to rule. His rival Xunzi argued the opposite: that humans are born selfish and become good through training.'],
 why:'The debate between Mencius and Xunzi on whether people are born good still runs through psychology and education.',
 terms:[{w:'Four sprouts',d:'Four natural feelings Mencius named: compassion, shame, deference and a sense of right and wrong.'}],
 books:[{t:'Mencius',y:'4th–3rd c. BCE'},{t:'Xunzi (the rival view)',y:'3rd c. BCE'},{t:'Analects',y:'compiled after Confucius'}],
 quiz:{q:'What image does Mencius use for human nature?',options:['A blank page','A sprout that needs the right conditions','A locked gate'],answer:1,why:'Goodness begins as a small sprout that nurture can grow or stunt.'}},
{id:'zhuangzi',name:'Zhuangzi',years:'c. 369–286 BCE',place:'China',title:'The butterfly dream',
 idea:'Zhuangzi told of dreaming he was a butterfly, then waking and wondering whether he was a man who dreamed of a butterfly or a butterfly dreaming it was a man. The story loosens the idea that our own viewpoint is the only true one.',
 analogy:'Looking at a city from the street, then from a plane. Neither view is false, but each shows different things.',
 question:'Which of your fixed views might look different from someone else’s seat?',
 deeper:['The Zhuangzi is a book of stories, jokes and arguments. Parts were probably written by Zhuangzi himself and parts by later followers. It is a founding text of Daoism, alongside the Tao Te Ching.','He prized spontaneity and skill that comes without strain, as in the story of the cook who carves an ox so smoothly that his knife never dulls.'],
 why:'It is a classic reminder that being sure and being right are different things.',
 terms:[{w:'Perspective',d:'Each viewpoint sees only part, so insisting on one cuts you off from the rest.'}],
 books:[{t:'Zhuangzi',y:'c. 3rd c. BCE'},{t:'Tao Te Ching (companion text)',y:'c. 4th c. BCE'}],
 quiz:{q:'What did Zhuangzi dream he was?',options:['A king','A mountain','A butterfly'],answer:2,why:'He could not tell whether he was a man dreaming of a butterfly or the reverse.'}},
{id:'epicurus',name:'Epicurus',years:'341–270 BCE',place:'Athens',title:'Simple pleasures',
 idea:'Epicurus taught that the good life is a calm, pain-free one, and that the most reliable pleasures are simple: friends, enough food, and thinking. He argued that fear of death and of the gods causes needless misery, because death is just the end of feeling.',
 analogy:'A plain meal of bread and olives with friends, not a banquet that leaves you sick. Enough, shared, is the point.',
 question:'What do you chase that adds more worry than joy?',
 deeper:['He founded a community called the Garden in Athens, which welcomed friends and, unusually for the time, women and slaves. Only a few of his letters survive.','He is often mistaken for a seeker of luxury. In fact, he thought chasing wealth and fame creates anxiety, and that wanting less is the surer route to contentment.'],
 why:'His idea that friendship and simple living matter more than status runs through modern happiness research.',
 terms:[{w:'Ataraxia',d:'Tranquility: a mind not disturbed by fear or worry.'}],
 booksNote:'Most of his many works are lost. Lucretius’s poem presents his ideas.',
 books:[{t:'Letter to Menoeceus',y:'c. 300 BCE'},{t:'Principal Doctrines',y:'c. 300 BCE'},{t:'On the Nature of Things (Lucretius)',y:'c. 55 BCE'}],
 quiz:{q:'What did Epicurus think the best pleasures are?',options:['Wealth and fame','Simple, lasting ones like friendship','Extreme physical thrills'],answer:1,why:'He favored calm, modest pleasures that do not bring regret.'}},
{id:'marcus',name:'Marcus Aurelius',years:'121–180 CE',place:'Rome',title:'The inner citadel',
 idea:'Marcus Aurelius was Roman emperor and a Stoic. In private notebooks he reminded himself to control his own judgments and actions, accept what he could not change, and act for the common good. The mind, he wrote, can be a fortress that events cannot enter.',
 analogy:'A rock at the shore. Waves keep hitting it, and it stays itself while the water falls back.',
 question:'What will you do today only because it is right, not because anyone will see?',
 deeper:['His notebooks were not meant for publication. They were later collected as the Meditations, written in Greek, partly during military campaigns.','He drew on Epictetus, whom he read closely. Duty, impermanence and treating others fairly run through the book.'],
 why:'It remains one of the most-read guides to staying steady under pressure.',
 terms:[{w:'Logos',d:'The reasoning order of the universe, which Stoics thought humans share in.'}],
 books:[{t:'Meditations',y:'c. 170–180 CE'},{t:'Discourses (Epictetus), his main influence',y:'early 2nd c. CE'},{t:'Letters to Lucilius (Seneca)',y:'c. 62–65 CE'}],
 quiz:{q:'What did Marcus Aurelius write the Meditations as?',options:['A public law code','A history of Rome','Private notes to himself'],answer:2,why:'They were personal reminders, not meant for readers.'}},
{id:'augustine',name:'Augustine',years:'354–430 CE',place:'North Africa and Rome',title:'The restless heart',
 idea:'Augustine wrote that the human heart is restless until it rests in God. His Confessions looks closely at memory, desire and time, and asks why we do wrong even when we know better.',
 analogy:'A compass needle that keeps swinging until it finds north.',
 question:'What do you keep wanting that you suspect is standing in for something else?',
 deeper:['Born in what is now Algeria, he lived a worldly youth, taught rhetoric, and followed Manichaeism before converting to Christianity in his thirties. He later became bishop of Hippo.','The Confessions is often called one of the first Western autobiographies. The City of God, written after Rome was sacked in 410, argued that earthly cities rise and fall while a deeper community endures.'],
 why:'His close look at will, habit and inner conflict shaped Western ideas of the self.',
 terms:[{w:'Free will',d:'The power to choose. Augustine explored how the will can be divided against itself.'}],
 books:[{t:'Confessions',y:'c. 397–400'},{t:'The City of God',y:'413–426'},{t:'On Free Choice of the Will',y:'c. 388–395'}],
 quiz:{q:'What is the Confessions often called?',options:['A treatise on warfare','One of the first Western autobiographies','A collection of laws'],answer:1,why:'It is a personal account of his search and his inner conflicts.'}},
{id:'avicenna',name:'Avicenna (Ibn Sina)',years:'980–1037',place:'Persia',title:'The floating man',
 idea:'Avicenna imagined a person created suddenly in mid-air, blindfolded, floating, with no sensation of the body. He argued that this person would still know that he exists, which suggests the self is more than the body and the senses.',
 analogy:'Turning off every light and every sound in a room, and finding you are still there.',
 question:'If you lost every sense for a moment, what would still feel like you?',
 deeper:['Avicenna was a physician and philosopher in the medieval Islamic world. His Canon of Medicine was a standard textbook in Europe and the Middle East for centuries.','He blended Aristotle’s thought with Neoplatonism, and argued that essence and existence are different: knowing what a thing is does not tell you that it exists. Aquinas later built on this.'],
 why:'The floating man is an early version of the thought experiments still used to ask what the self is.',
 terms:[{w:'Essence and existence',d:'What a thing is versus the fact that it is.'}],
 books:[{t:'The Canon of Medicine',y:'1025'},{t:'The Book of Healing',y:'c. 1020s'},{t:'Pointers and Reminders',y:'c. 1030s'}],
 quiz:{q:'What does the floating man suggest?',options:['The senses are all we are','The self is more than the body and senses','Time does not exist'],answer:1,why:'Even with no sensation, the person would still know that he exists.'}},
{id:'alghazali',name:'Al-Ghazali',years:'1058–1111',place:'Persia and Baghdad',title:'Doubt, then light',
 idea:'Al-Ghazali was a leading scholar who fell into a crisis of doubt about whether reasoning and the senses could be trusted. He recovered not through argument alone but through direct experience and spiritual practice. He also argued that reason cannot prove everything about God.',
 analogy:'Realizing that a map, however accurate, is not a walk through the country.',
 question:'What do you know only from reading about it, not from living it?',
 deeper:['He taught in Baghdad, then left his post in 1095 after a crisis, and traveled and wrote for years. His Deliverance from Error tells this story.','The Incoherence of the Philosophers challenged thinkers like Avicenna. His point that we see events follow one another but never the force linking them is often compared to Hume’s much later argument.'],
 why:'He is a model of taking radical doubt seriously and still finding a way forward.',
 terms:[{w:'Sufism',d:'A mystical tradition in Islam focused on direct experience of the divine.'}],
 books:[{t:'Deliverance from Error',y:'c. 1100'},{t:'The Incoherence of the Philosophers',y:'c. 1095'},{t:'The Revival of the Religious Sciences',y:'c. 1095–1105'}],
 quiz:{q:'What was al-Ghazali’s crisis about?',options:['How to govern a state','How to translate Greek texts','Whether reason and the senses could be trusted'],answer:2,why:'He doubted both and found his way out through experience and practice.'}},
{id:'maimonides',name:'Maimonides',years:'1138–1204',place:'Spain, Morocco and Egypt',title:'A guide for the perplexed',
 idea:'Maimonides was a Jewish scholar and physician who argued that faith and reason do not conflict. He held that it is safer to say what God is not than what God is, because human words fall short of the divine. His Guide was written for readers troubled by apparent clashes between philosophy and scripture.',
 analogy:'Describing a color to someone by listing every color it is not.',
 question:'Where is admitting what words cannot capture the more honest answer?',
 deeper:['Born in Córdoba, he left Spain as a young man, later settled in Egypt, and served as a court physician. He also wrote the Mishneh Torah, a systematic code of Jewish law.','He drew heavily on Aristotle, and Thomas Aquinas read and responded to him. The Guide was written in Arabic using Hebrew letters.'],
 why:'He is a model for reconciling belief with careful reasoning.',
 terms:[{w:'Negative theology',d:'Speaking about God by saying what God is not.'}],
 books:[{t:'Guide for the Perplexed',y:'c. 1190'},{t:'Mishneh Torah',y:'c. 1180'},{t:'Commentary on the Mishnah',y:'c. 1168'}],
 quiz:{q:'What was the Guide for the Perplexed written to address?',options:['Apparent clashes between faith and philosophy','A trade dispute','Rules of medicine'],answer:0,why:'It aimed to help readers who felt torn between reason and scripture.'}},
{id:'aquinas',name:'Thomas Aquinas',years:'1225–1274',place:'Italy and France',title:'Faith and reason together',
 idea:'Aquinas argued that reason and faith are two ways of reaching truth that cannot truly contradict each other. He offered five arguments for God’s existence and built a vast system joining Aristotle’s philosophy with Christian teaching. He also held that human law should be judged against deeper moral law.',
 analogy:'Two windows onto the same landscape. They frame it differently, but it is one landscape.',
 question:'What do you accept on trust, and what do you insist on testing?',
 deeper:['A Dominican friar who taught in Paris, he wrote the Summa Theologiae, a huge work he left unfinished. He drew on Aristotle, Augustine, Avicenna and Maimonides.','His natural law theory says people can know basic moral truths through reason, and that unjust laws lose their binding force. This idea influenced later legal and political thought.'],
 why:'His idea that reason can discover moral truth underlies much of Western law and ethics.',
 terms:[{w:'Natural law',d:'Moral principles people can know through reason, apart from written laws.'}],
 books:[{t:'Summa Theologiae',y:'1265–1274'},{t:'Summa contra Gentiles',y:'c. 1259–1265'},{t:'On Being and Essence',y:'c. 1252–1256'}],
 quiz:{q:'Aquinas held that faith and reason...',options:['Are always at war','Cannot truly contradict each other','Are the same thing'],answer:1,why:'He saw them as two roads to the same truth.'}},
{id:'ibnkhaldun',name:'Ibn Khaldun',years:'1332–1406',place:'Tunis, Spain and Egypt',title:'Rise and fall of dynasties',
 idea:'Ibn Khaldun argued that societies rise through strong group solidarity and decline as comfort wears it away. Rulers gain power from tight bonds, then grow soft and dependent on taxes and luxury, and a new group takes over. He treated history as something to explain, not just list.',
 analogy:'A family business. The founders are scrappy and united, and later generations inherit comfort and lose the drive.',
 question:'Which group you belong to could lose its edge once it feels secure?',
 deeper:['He served in courts across North Africa and Spain and was also a judge. He wrote the Muqaddimah, an introduction to his larger history, in 1377.','He is often called a pioneer of sociology and economics, because he looked for patterns in how taxes, trade, geography and group loyalty shape states.'],
 why:'His method of explaining history through social forces foreshadows modern social science.',
 terms:[{w:'Asabiyyah',d:'Group solidarity: the social cohesion that binds a community together.'}],
 books:[{t:'Muqaddimah',y:'1377'},{t:'Kitab al-Ibar (Book of Lessons)',y:'1377'},{t:'Al-Taarif (his autobiography)',y:'late 14th c.'}],
 quiz:{q:'What does asabiyyah mean?',options:['Trade tariffs','Divine law','Group solidarity'],answer:2,why:'It is the social cohesion that gives a group its strength.'}},
{id:'machiavelli',name:'Niccolò Machiavelli',years:'1469–1527',place:'Florence, Italy',title:'Politics as it is',
 idea:'Machiavelli argued that leaders should judge politics by what actually works, not by how we wish the world were. He advised princes that the appearance of virtue matters and that harsh acts may sometimes be needed to keep order. He also wrote in favor of republics and civic liberty.',
 analogy:'A ship captain who studies real storms instead of the ideal calm sea.',
 question:'Where do you judge people by how they should act instead of how they do?',
 deeper:['A Florentine diplomat, he lost his post when the Medici returned, and wrote The Prince in 1513 while in exile on his farm. It was published after his death.','His Discourses on Livy shows a different side, praising republics and warning how power corrupts. Readers still argue whether The Prince is a handbook, a satire or a warning.'],
 why:'He opened the habit of describing politics realistically, which still shapes political science.',
 terms:[{w:'Virtù',d:'Skill and boldness in seizing opportunity, not simple goodness.'},{w:'Fortuna',d:'Luck or fate, which a wise leader prepares for but cannot control.'}],
 books:[{t:'The Prince',y:'written 1513, published 1532'},{t:'Discourses on Livy',y:'c. 1517'},{t:'The Art of War',y:'1521'}],
 quiz:{q:'Machiavelli urged leaders to judge politics by...',options:['What tradition says','What actually works','What is most pleasant'],answer:1,why:'He wanted politics described as it is, not as we wish it were.'}},
{id:'wangyangming',name:'Wang Yangming',years:'1472–1529',place:'China',title:'Knowing is doing',
 idea:'Wang Yangming taught that knowing and acting are one. If you truly know that something is right, you act on it, and if you do not act, you did not really know. He held that everyone has an inborn sense of the good, and that learning means clearing away what clouds it.',
 analogy:'Knowing a recipe by heart but never cooking. You know the words, not the dish.',
 question:'What do you say you believe but have never acted on?',
 deeper:['A Ming dynasty scholar, official and general, he reportedly had a breakthrough while exiled in a remote region, realizing that the principle of things lies in the mind, not out in the world.','His school, called the Learning of the Mind, rivaled the more book-centered school of Zhu Xi. It influenced thinkers across East Asia for centuries.'],
 why:'His idea that sincerity requires action challenges anyone who agrees in theory but waits.',
 terms:[{w:'Liangzhi',d:'Innate knowing of what is good, which everyone has.'}],
 books:[{t:'Instructions for Practical Living (Chuanxilu)',y:'compiled from 1518'},{t:'Inquiry on the Great Learning',y:'1527'}],
 quiz:{q:'What did Wang Yangming say about knowing and acting?',options:['Knowing always comes years before acting','They are unrelated','They are one'],answer:2,why:'For him, real knowledge already includes acting on it.'}},
{id:'hobbes',name:'Thomas Hobbes',years:'1588–1679',place:'England',title:'Life without a state',
 idea:'Hobbes imagined life with no government as a war of all against all, where fear and distrust make life short and miserable. To escape it, he argued, people agree to give up some freedom to a sovereign who keeps the peace.',
 analogy:'Everyone pushing at a crowded exit at once. One set of rules and an usher lets everybody out.',
 question:'Which rules do you accept because the alternative is chaos?',
 deeper:['Hobbes wrote Leviathan in 1651, during the English Civil War, which shaped his fear of disorder. The title refers to the state as a giant artificial person made of its citizens.','He argued that authority comes from the consent of the governed, though he thought that consent, once given, should not be withdrawn lightly. Locke and Rousseau answered him.'],
 why:'He framed the question every state faces: what do we give up for security?',
 terms:[{w:'State of nature',d:'Life imagined without any government or shared rules.'},{w:'Social contract',d:'An agreement to form a society and obey its authority.'}],
 books:[{t:'Leviathan',y:'1651'},{t:'De Cive',y:'1642'},{t:'The Elements of Law',y:'1640'}],
 quiz:{q:'What did Hobbes think life without government would be like?',options:['A peaceful paradise','A constant war of all against all','A world of equal wealth'],answer:1,why:'Without a shared authority, fear and distrust would drive everyone against everyone.'}},
{id:'spinoza',name:'Baruch Spinoza',years:'1632–1677',place:'Amsterdam and The Hague',title:'One nature',
 idea:'Spinoza argued that there is only one reality, which he called God or Nature, and that everything is part of it. Nothing happens by chance or outside nature’s laws, including our emotions. Understanding why we feel what we feel frees us from being pushed around by it.',
 analogy:'Waves on the ocean. Each looks separate, but all are the same water.',
 question:'Which of your reactions do you understand well enough that it no longer pushes you?',
 deeper:['Expelled from Amsterdam’s Jewish community in 1656, Spinoza earned a living grinding lenses and wrote quietly. His main work, the Ethics, was published after his death in 1677.','He wrote it in the style of geometry, with definitions and proofs. He argued against a God who intervenes and judges, and defended freedom of thought in his Theological-Political Treatise.'],
 why:'His idea that understanding emotions loosens their grip anticipates modern therapy.',
 terms:[{w:'Substance',d:'The one thing that exists in itself. For Spinoza it is God or Nature.'},{w:'Conatus',d:'The effort every thing makes to keep existing and flourish.'}],
 books:[{t:'Ethics',y:'1677'},{t:'Theological-Political Treatise',y:'1670'},{t:'Treatise on the Emendation of the Intellect',y:'written 1660s'}],
 quiz:{q:'How many substances did Spinoza say exist?',options:['Two','Infinitely many separate ones','One'],answer:2,why:'Everything is part of one substance: God or Nature.'}},
{id:'locke',name:'John Locke',years:'1632–1704',place:'England',title:'A blank slate',
 idea:'Locke argued that we are born with no ideas in the mind. All knowledge comes from experience, through the senses and by reflecting on what they give us. In politics, he argued that people have natural rights to life, liberty and property, and that governments exist by consent to protect them.',
 analogy:'A new notebook. What ends up on its pages depends on what happens to it.',
 question:'Which of your convictions came from experience, and which were simply handed to you?',
 deeper:['His Essay Concerning Human Understanding (1689) set out the case against innate ideas. His Two Treatises of Government became a major source for later arguments for limited government and rights.','He also argued for religious toleration in A Letter Concerning Toleration, though his views had limits. His ideas influenced the American founding.'],
 why:'His ideas about consent and rights underlie many modern constitutions.',
 terms:[{w:'Tabula rasa',d:'Latin for blank slate: the idea that the mind starts empty.'},{w:'Natural rights',d:'Rights people have simply by being human.'}],
 books:[{t:'Two Treatises of Government',y:'1689'},{t:'An Essay Concerning Human Understanding',y:'1689'},{t:'A Letter Concerning Toleration',y:'1689'}],
 quiz:{q:'Locke said that knowledge comes from...',options:['Inborn ideas','Experience','Divine whispers'],answer:1,why:'He held that the mind starts blank and fills through experience.'}},
{id:'leibniz',name:'Gottfried Leibniz',years:'1646–1716',place:'Germany',title:'The best of all possible worlds',
 idea:'Leibniz argued that everything has a sufficient reason, and that the actual world is the best of those God could have made. He pictured reality as made of countless tiny mind-like units called monads, each reflecting the whole universe from its own point of view.',
 analogy:'A hall of thousands of mirrors, each showing the same room from a different angle.',
 question:'What event in your life would you not change if it meant losing what came after?',
 deeper:['Leibniz was a mathematician as well as a philosopher. He developed calculus independently of Newton and worked on binary numbers, which later underlie computers.','His view that this is the best possible world was mocked by Voltaire in Candide, though Leibniz meant it as a claim about what a perfect creator would choose, not that life is easy.'],
 why:'His work on logic and binary code is a root of modern computing.',
 terms:[{w:'Monad',d:'A simple, indivisible unit that Leibniz thought makes up reality.'},{w:'Principle of sufficient reason',d:'Nothing is without a reason why it is so and not otherwise.'}],
 books:[{t:'Monadology',y:'1714'},{t:'Theodicy',y:'1710'},{t:'New Essays on Human Understanding',y:'written 1704, published 1765'}],
 quiz:{q:'What are monads, for Leibniz?',options:['Simple units that make up reality','Types of government','Moral rules'],answer:0,why:'He saw reality as built from countless tiny, mind-like units.'}},
{id:'rousseau',name:'Jean-Jacques Rousseau',years:'1712–1778',place:'Geneva and France',title:'Born free',
 idea:'Rousseau argued that people are naturally good and that society’s inequality and vanity corrupt them. He proposed that a legitimate government rests on the general will, the shared interest of citizens, and that freedom means obeying laws you have given yourself.',
 analogy:'A town meeting writes its own rules, and a driver who helped write them obeys them gladly.',
 question:'Which rules do you follow that you had no part in making?',
 deeper:['Rousseau was born in Geneva and became famous in Paris. His Discourse on Inequality (1755) traced how property and comparison create unfairness. The Social Contract (1762) opens by saying people are born free yet everywhere in chains.','He also wrote Emile, a book on education that urged learning through experience. Kant admired him, and his ideas fed into the French Revolution.'],
 why:'He raised the question of whether a state can be both authoritative and truly free.',
 terms:[{w:'General will',d:'What citizens want together as a community, as opposed to what each wants alone.'}],
 books:[{t:'The Social Contract',y:'1762'},{t:'Discourse on Inequality',y:'1755'},{t:'Emile',y:'1762'}],
 quiz:{q:'What did Rousseau say freedom means?',options:['Having no laws','Doing whatever you want','Obeying laws you have given yourself'],answer:2,why:'In a good society, citizens are bound only by rules they share in making.'}},
{id:'wollstonecraft',name:'Mary Wollstonecraft',years:'1759–1797',place:'England',title:'Equal minds',
 idea:'Mary Wollstonecraft argued that women seem less rational than men only because they are denied a good education. In A Vindication of the Rights of Woman she called for girls and boys to be educated alike, so that marriage could be a partnership of equals instead of dependence.',
 analogy:'Two plants given different light, then blamed for growing differently.',
 question:'Whose potential have you judged by the conditions they were given?',
 deeper:['Writing in 1792, she was one of the first major voices of what became feminism. She also wrote A Vindication of the Rights of Men (1790) in answer to Edmund Burke.','She criticized thinkers such as Rousseau on women’s education. She died days after giving birth to her daughter Mary, who later wrote Frankenstein as Mary Shelley.'],
 why:'Her case that opportunity, not nature, explains many differences still frames debates on education.',
 terms:[{w:'Rights of woman',d:'The claim that women, like men, are rational beings owed equal respect and opportunity.'}],
 books:[{t:'A Vindication of the Rights of Woman',y:'1792'},{t:'A Vindication of the Rights of Men',y:'1790'},{t:'Letters Written in Sweden, Norway, and Denmark',y:'1796'}],
 quiz:{q:'What did Wollstonecraft say explains women’s apparent weakness in reason?',options:['Being denied education','Natural and fixed differences','Proof from science'],answer:0,why:'She argued that opportunity, not nature, produced the difference.'}},
{id:'hegel',name:'G. W. F. Hegel',years:'1770–1831',place:'Germany',title:'Ideas that grow by conflict',
 idea:'Hegel saw history and thought as a process driven by tension. An idea meets its opposite, and the clash produces a richer view that includes both. He thought freedom grows over time as people come to understand themselves and recognize one another.',
 analogy:'A debate that ends with a better position than either side started with.',
 question:'What disagreement in your life might hold a bigger idea than either side has?',
 deeper:['He taught in Berlin and was the most influential German philosopher of his day. His Phenomenology of Spirit (1807) traces how consciousness develops through stages.','The popular formula of thesis, antithesis and synthesis is often credited to him, though he rarely used those words. Marx and Kierkegaard both responded to him, in opposite directions.'],
 why:'He taught that ideas and institutions are best understood as they develop over time.',
 terms:[{w:'Dialectic',d:'Progress through the clash of opposing ideas and their resolution.'}],
 books:[{t:'Lectures on the Philosophy of History',y:'1837, from lectures'},{t:'Phenomenology of Spirit',y:'1807'},{t:'Elements of the Philosophy of Right',y:'1820'}],
 quiz:{q:'Hegel saw progress as coming from...',options:['Avoiding all conflict','The clash and resolution of opposing ideas','Isolated individual effort'],answer:1,why:'Tension between opposing ideas drives thought and history forward.'}},
{id:'schopenhauer',name:'Arthur Schopenhauer',years:'1788–1860',place:'Germany',title:'The restless will',
 idea:'Schopenhauer argued that behind the world we see lies a blind striving he called the will, which drives us to want one thing after another. Satisfaction is brief, then boredom or new wants return. Relief comes through art, compassion and calming desire.',
 analogy:'A pendulum swinging between wanting and being bored.',
 question:'What do you want right now that you suspect will not satisfy you for long?',
 deeper:['His main work, The World as Will and Representation, appeared in 1818 to little notice. He gained fame late in life.','He was influenced by Kant and by Indian philosophy, including the Upanishads, and he influenced later thinkers such as Nietzsche.'],
 why:'His view of desire as an engine of dissatisfaction anticipates modern talk of the hedonic treadmill.',
 terms:[{w:'Will',d:'The blind, driving force he saw behind all things, including our own desires.'}],
 books:[{t:'Parerga and Paralipomena (essays)',y:'1851'},{t:'The World as Will and Representation',y:'1818'},{t:'On the Basis of Morality',y:'1840'}],
 quiz:{q:'What did Schopenhauer call the blind striving behind the world?',options:['The state','The spirit','The will'],answer:2,why:'He saw a restless will driving all things, including human desire.'}},
{id:'kierkegaard',name:'Søren Kierkegaard',years:'1813–1855',place:'Copenhagen',title:'The leap',
 idea:'Kierkegaard argued that some of the biggest life choices cannot be settled by logic. Faith, love and commitment require a leap that reason cannot guarantee. Each person must choose how to live and take responsibility for it, rather than hiding in the crowd.',
 analogy:'Standing at the end of a diving board. No calculation can do the jump for you.',
 question:'What decision are you trying to settle by thinking when it needs a commitment?',
 deeper:['He lived mostly in Copenhagen and wrote under invented names, so different voices could argue different views. Fear and Trembling (1843) examines the story of Abraham and Isaac.','He opposed Hegel’s grand systems, arguing that living individuals matter more than abstract theory. He is often called the father of existentialism.'],
 why:'His focus on personal responsibility and anxiety shaped existentialism and modern psychology.',
 terms:[{w:'Leap of faith',d:'A commitment made without proof, because proof is not possible.'},{w:'Anxiety',d:'The dizziness of facing freedom and possibility.'}],
 books:[{t:'Fear and Trembling',y:'1843'},{t:'Either/Or',y:'1843'},{t:'The Sickness Unto Death',y:'1849'}],
 quiz:{q:'What did Kierkegaard say big commitments require?',options:['A complete logical proof','Majority approval','A leap beyond proof'],answer:2,why:'Some choices cannot be settled by reasoning and need a leap.'}},
{id:'marx',name:'Karl Marx',years:'1818–1883',place:'Germany, France and England',title:'History moves with work',
 idea:'Marx argued that the way a society organizes work and wealth shapes its laws, ideas and conflicts. He saw history as a struggle between classes, and argued that capitalism, while productive, treats workers as tools and produces alienation. He predicted it would give way to a more equal order.',
 analogy:'A house whose rooms are shaped by its plumbing and wiring. Change the foundation, and the rooms must change.',
 question:'What in your work feels like it belongs to someone else?',
 deeper:['With Friedrich Engels he wrote The Communist Manifesto in 1848. His major economic work, Capital, began appearing in 1867.','He took Hegel’s idea of change through conflict but moved it from ideas to material conditions. Whether his predictions held, and what was done in his name, remain fiercely debated.'],
 why:'Even his critics use his questions about class, labor and power.',
 terms:[{w:'Alienation',d:'Feeling cut off from your work, what you make, and other people.'},{w:'Class struggle',d:'The conflict between groups with different economic interests.'}],
 books:[{t:'The Communist Manifesto',y:'1848'},{t:'Economic and Philosophic Manuscripts of 1844',y:'written 1844, published 1932'},{t:'Capital, Volume 1',y:'1867'}],
 quiz:{q:'What did Marx say shapes a society’s ideas and laws?',options:['How work and wealth are organized','Climate alone','Individual genius'],answer:0,why:'He argued that material and economic conditions shape the rest.'}},
{id:'nietzsche',name:'Friedrich Nietzsche',years:'1844–1900',place:'Germany and Switzerland',title:'Become who you are',
 idea:'Nietzsche challenged inherited values and asked whether they serve life. He argued that people should create their own meaning, take responsibility for it, and overcome themselves. His famous test: could you want your life to repeat endlessly, exactly as it is?',
 analogy:'Rewatching the same film forever. Would you choose the film?',
 question:'Would you choose to relive today again and again?',
 deeper:['He worked as a professor in Basel until illness forced him to resign. His major works include Thus Spoke Zarathustra (1883–1885) and On the Genealogy of Morality (1887).','His writing was later twisted by others, including his sister and the Nazis, though he opposed antisemitism and German nationalism. Readers still debate what he meant.'],
 why:'He pushed readers to examine why they hold the values they do.',
 terms:[{w:'Eternal recurrence',d:'The thought experiment of living your life again and again, endlessly.'},{w:'Will to power',d:'A drive to grow, overcome and shape one’s world.'}],
 books:[{t:'The Gay Science',y:'1882'},{t:'Thus Spoke Zarathustra',y:'1883–1885'},{t:'On the Genealogy of Morality',y:'1887'}],
 quiz:{q:'What is eternal recurrence?',options:['A theory of rebirth','A test: would you live your life over, endlessly?','A law of motion'],answer:1,why:'It is a thought experiment about whether you would affirm your life exactly as it is.'}},
{id:'wittgenstein',name:'Ludwig Wittgenstein',years:'1889–1951',place:'Austria and England',title:'Words are tools',
 idea:'Wittgenstein argued that many philosophical puzzles come from misusing language. Later he proposed that a word’s meaning is its use in a shared practice, like a move in a game with rules. To clear confusion, look at how words actually work.',
 analogy:'Telling a wrench from a hammer by what it does, not by how it looks.',
 question:'Which word in your arguments means different things to different people?',
 deeper:['His first book, the Tractatus (1921), tried to set out the limits of what can be said clearly. Later he rejected much of it in Philosophical Investigations, published in 1953 after his death.','He taught at Cambridge and lived an unusual life, once giving away a family fortune. He saw philosophy as a way of untangling language, not building theories.'],
 why:'He changed how philosophers think about meaning, and his ideas shape debates in linguistics and AI.',
 terms:[{w:'Language game',d:'A practice in which words get their meaning from how people use them.'}],
 books:[{t:'Philosophical Investigations',y:'1953'},{t:'Tractatus Logico-Philosophicus',y:'1921'},{t:'On Certainty',y:'1969'}],
 quiz:{q:'In the later Wittgenstein, a word’s meaning is...',options:['A mental picture','Its spelling','Its use in a practice'],answer:2,why:'Meaning comes from how people use words in shared activities.'}},
{id:'heidegger',name:'Martin Heidegger',years:'1889–1976',place:'Germany',title:'Being in the world',
 idea:'Heidegger asked what it means to be at all, and argued we first meet things through use, not as objects to study. A hammer is understood in hammering. He thought modern life makes us forget the question of being and treat everything as a resource.',
 analogy:'You notice a doorknob only when it breaks. Before that, it simply works.',
 question:'What have you stopped noticing because it always works?',
 deeper:['His book Being and Time (1927) is among the most influential and difficult philosophy texts of the 20th century. It shaped existentialism, hermeneutics and phenomenology.','He joined the Nazi Party in 1933 and held a university post under the regime, a fact that deeply troubles his legacy. Scholars still argue about how to read his work in light of it.'],
 why:'His analysis of technology and attention still informs debates on how tools shape experience.',
 terms:[{w:'Dasein',d:'His word for human existence: the being for whom being is a question.'}],
 books:[{t:'The Question Concerning Technology',y:'1954'},{t:'Being and Time',y:'1927'},{t:'Introduction to Metaphysics',y:'1953'}],
 quiz:{q:'How does Heidegger say we first meet things?',options:['As abstract objects','Through numbers','Through using them'],answer:2,why:'We understand things first by working with them, not by studying them from outside.'}},
{id:'beauvoir',name:'Simone de Beauvoir',years:'1908–1986',place:'Paris, France',title:'One is not born, but becomes',
 idea:'Simone de Beauvoir argued that existence comes first and that people become who they are through choices and circumstances. In The Second Sex she showed how society shapes ideas of womanhood and treats women as the other. She said real freedom requires working for the freedom of others too.',
 analogy:'A role handed out before the play begins. You can only change it once you notice the script.',
 question:'Which expectations did you inherit that you never chose?',
 deeper:['She was a philosopher, novelist and lifelong partner of Jean-Paul Sartre. The Second Sex (1949) became a foundation of modern feminist thought.','In The Ethics of Ambiguity (1947) she argued that humans are both free and limited, and that this tension is not a flaw but the condition for living morally.'],
 why:'She gave later feminism its core idea that gender is shaped by society.',
 terms:[{w:'The Other',d:'Being defined by someone else’s view of you, as secondary to a norm.'},{w:'Ambiguity',d:'Being both free and constrained at the same time.'}],
 books:[{t:'The Second Sex',y:'1949'},{t:'The Ethics of Ambiguity',y:'1947'},{t:'The Mandarins',y:'1954'}],
 quiz:{q:'What does The Second Sex examine?',options:['The history of mathematics','How society shapes ideas of womanhood','Rules of grammar'],answer:1,why:'It shows how roles for women are made by society, not by nature.'}},
{id:'sartre',name:'Jean-Paul Sartre',years:'1905–1980',place:'Paris, France',title:'Existence before essence',
 idea:'Sartre held that humans are not born with a fixed purpose or nature. We exist first, then define ourselves through what we choose and do. That means we are free, and responsible for what we make of ourselves, with no excuses.',
 analogy:'An actor with no script who must write the part while playing it.',
 question:'What excuse do you use to avoid choosing?',
 deeper:['Sartre was a philosopher, playwright and novelist. Being and Nothingness (1943) is his major philosophical work, and No Exit (1944) is a play set in a room with three people.','He argued that pretending we have no choice is bad faith. He refused the 1964 Nobel Prize in Literature, saying a writer should not be turned into an institution.'],
 why:'His emphasis on choice and responsibility shapes popular ideas of authenticity.',
 terms:[{w:'Bad faith',d:'Denying your freedom by pretending you have no choice.'},{w:'Existence precedes essence',d:'You exist first, then make yourself what you are.'}],
 books:[{t:'Existentialism Is a Humanism',y:'1946'},{t:'Being and Nothingness',y:'1943'},{t:'No Exit',y:'1944'}],
 quiz:{q:'What does Sartre call pretending you have no choice?',options:['Natural law','Dialectic','Bad faith'],answer:2,why:'It means denying your own freedom to avoid responsibility.'}},
{id:'arendt',name:'Hannah Arendt',years:'1906–1975',place:'Germany and United States',title:'Beginnings',
 idea:'Hannah Arendt argued that every birth is a new beginning, and that people show who they are by acting and speaking together in public. She warned that totalitarian regimes destroy this shared space, and that great harm can be done by ordinary people who stop thinking.',
 analogy:'A town square that only works if people actually show up and talk.',
 question:'What would you start if you trusted others to join in?',
 deeper:['She fled Nazi Germany and settled in the United States. The Origins of Totalitarianism (1951) examined how Nazism and Stalinism arose.','Covering the 1961 trial of Adolf Eichmann, she wrote of the banality of evil: the idea that terrible acts can come from thoughtless obedience, not monstrous hatred. The phrase has stirred debate ever since.'],
 why:'Her ideas about public life, truth and thoughtlessness speak to modern politics.',
 terms:[{w:'Natality',d:'The human capacity to begin something new.'},{w:'Banality of evil',d:'Great harm done by ordinary people who do not think about what they do.'}],
 books:[{t:'The Human Condition',y:'1958'},{t:'The Origins of Totalitarianism',y:'1951'},{t:'Eichmann in Jerusalem',y:'1963'}],
 quiz:{q:'What is natality, for Arendt?',options:['The capacity to begin something new','A kind of law','A theory of numbers'],answer:0,why:'Every birth brings a new beginning into the world.'}},
{id:'rawls',name:'John Rawls',years:'1921–2002',place:'United States',title:'The veil of ignorance',
 idea:'Rawls asked how to design a fair society if you did not know your place in it, whether rich or poor, strong or weak. Behind that veil of ignorance, he argued, you would choose equal basic liberties and allow inequalities only if they help the worst off.',
 analogy:'Cutting the cake without knowing which slice you will get.',
 question:'Which rule would you keep if you did not know which side of it you would be on?',
 deeper:['Rawls taught at Harvard. A Theory of Justice (1971) revived political philosophy in the English-speaking world and was a response to utilitarianism.','He drew on Kant and the social contract tradition, treating justice as fairness among free and equal people.'],
 why:'His thought experiment is widely used to test whether a rule is fair.',
 terms:[{w:'Original position',d:'An imagined starting point where people choose rules without knowing their own status.'},{w:'Difference principle',d:'Inequality is fair only if it benefits the least advantaged.'}],
 books:[{t:'A Theory of Justice',y:'1971'},{t:'Justice as Fairness: A Restatement',y:'2001'},{t:'Political Liberalism',y:'1993'}],
 quiz:{q:'What is the veil of ignorance?',options:['A voting system','A type of law','Choosing rules without knowing your own position'],answer:2,why:'It forces rules to be fair to everyone, since you might be anyone.'}}
];

['wiredu','Kwasi Wiredu','1931–2022','Ghana','Conceptual decolonization','bridge',[4,2,1931.7,'1931'],

['mbiti','John Mbiti','1931–2019','Kenya','Time and community','sun',[4,1,1931.8,'1931'],

['oluwole','Sophie Oluwole','1935–2018','Nigeria','Rethinking Yoruba thought','door',[4,0,1935,'1935'],

['dussel','Enrique Dussel','1934–2023','Argentina and Mexico','Philosophy of liberation','path',[4,2,1934,'1934'],

['nagel','Thomas Nagel','b. 1937','USA','What is it like to be a bat?','eye',[4,0,1937,'1937'],

['nozick','Robert Nozick','1938–2002','USA','The minimal state','key',[4,2,1938,'1938'],

['kripke','Saul Kripke','1940–2022','USA','Naming and necessity','key',[4,0,1940,'1940'],

['parfit','Derek Parfit','1942–2017','England','Persons and what matters','mirror',[4,1,1942,'1942'],

['dennett','Daniel Dennett','1942–2024','USA','Consciousness explained','knot',[4,0,1942.5,'1942'],

['singer','Peter Singer','b. 1946','Australia','Expanding the circle','bridge',[4,1,1946,'1946'],

['nussbaum','Martha Nussbaum','b. 1947','USA','Capabilities','tree',[4,2,1947,'1947'],

['appiah','Kwame Anthony Appiah','b. 1954','Ghana, England and USA','Cosmopolitanism','bridge',[4,2,1954,'1954'],

['butler','Judith Butler','b. 1956','USA','Gender as performance','mirror',[4,2,1956,'1956'],

['chalmers','David Chalmers','b. 1966','Australia and USA','The hard problem','eye',[4,0,1966,'1966'],

var DEEP={
socrates:['Socrates questioned people who claimed expertise, such as politicians, poets and craftsmen, and found that they could not defend their confident claims. He concluded that his only advantage was knowing that he did not know. He also argued that no one does wrong willingly: wrongdoing comes from ignorance of what is truly good.','Critics say the method mostly tears down and rarely builds. Many of Socrates’s dialogues end without an answer, which frustrated listeners then and readers now. Some also doubt that “virtue is knowledge” fits how people actually fail: we often know the good and still do otherwise.','Pick one word you use daily, such as “success” or “fair,” and write a definition in one sentence. Then try to find a case that breaks it.'],
plato:['In the Republic, Plato compares a just city to a just soul: reason should rule, spirit should support it, and appetite should obey. The cave story says education is turning the whole soul toward what is real, not pouring facts in. He believed the world we see copies deeper patterns, the Forms, which the mind can grasp.','Aristotle objected that Forms floating apart from things explain little about how real things work. Later readers worry that the ideal city sounds authoritarian, with rulers who censor poetry and control families. Karl Popper called it a blueprint for closed societies.','Think of something you do mostly out of habit. Ask which shadow on the wall it is: a copy of what, exactly?'],
aristotle:['Aristotle began with observation: he catalogued animals, constitutions and arguments before theorizing. In ethics he argued that virtues are habits that sit between extremes, such as courage between recklessness and cowardice. A good life is one of activity in line with reason, with friends, enough resources and time to think.','His physics and biology contained errors that held back science for centuries. His view that some people are “natural slaves” and that women are lesser is wrong, and it shows how thinking can be bent by its time. The “golden mean” can also sound vague: how do you find the middle?','Choose one virtue you want more of. Name the vice of too much and the vice of too little, and decide what the middle looks like tomorrow.'],
buddha:['The Buddha’s teaching begins with an observation: life includes dissatisfaction, and the mind keeps adding to it by craving. The eightfold path trains conduct, concentration and understanding together. He also taught that there is no fixed, unchanging self, only a stream of changing processes we label “me.”','Some critics ask whether freeing oneself from craving can slide into passivity or withdrawal. Others ask how rebirth fits with no fixed self. Buddhist schools have answered in different ways, and they still debate it.','For two minutes, notice one craving without acting on it. Just watch how it rises, peaks and fades.'],
confucius:['Confucius thought a good society grows from good relationships: parent and child, ruler and subject, friend and friend. Each role carries duties, and ritual gives respect a shape. He taught by example, saying that rulers who are virtuous will be followed without force. Learning, for him, never ends.','Critics argue that stress on roles and hierarchy can justify obedience to unjust authority and unequal treatment of women. Defenders reply that he also urged officials to criticize bad rulers and that later traditions reinterpreted his ideas.','Think of one relationship where you have a clear role. What is one small, concrete act of respect that would fit it today?'],
laozi:['The Tao Te Ching describes the Dao as the way things flow, too large for names. The sage acts by not forcing: water yields and yet wears down stone. Wu wei does not mean doing nothing; it means acting in harmony with the situation, without strain or ego.','Some argue that “don’t force it” is poor advice for changing unjust systems. Scholars also note that the text is short, poetic and open to many readings, so any single summary overstates certainty.','Pick a task you are forcing. For ten minutes, work with its natural grain instead of against it, and see what changes.'],
