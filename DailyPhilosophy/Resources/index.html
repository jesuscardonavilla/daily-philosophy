epicurus:['Epicurus held that pleasure is the aim of life but defined it as freedom from bodily pain and mental disturbance. He sorted desires into natural and necessary, natural but unnecessary, and empty. Friendship, he said, is the greatest source of security. He taught that we need not fear gods or death.','Critics say a life of withdrawal from politics and ambition is too timid. Stoics said virtue, not pleasure, is the aim. His argument that death is nothing to us does not fully calm many people’s worry about losing the time they would have had.','List three things you want. Mark each as necessary, natural but unnecessary, or empty. Then drop one empty one this week.'],
epictetus:['Epictetus, a former slave, taught that some things are up to us (judgments, desires, actions) and others are not (health, reputation, other people). Peace comes from caring only about the first group. When something upsets us, we should ask what judgment we are adding to the event.','Critics say the dichotomy of control is too neat, since health and relationships affect us deeply and we do act on them. Others worry that Stoic calm can turn into acceptance of injustice. Modern Stoics usually answer that acting well on what you can influence is part of the plan.','Next time you are annoyed, write one sentence naming the event and another naming your judgment about it. Notice how far apart they are.'],
seneca:['Seneca argued that life is long enough if we do not waste it. He warned against busyness, delay and chasing other people’s approval. His letters to Lucilius mix practical advice with Stoic ideas: imagine losses ahead of time, treat each day as a whole life, and keep friends who improve you.','Critics note a gap between his words and his life: he was wealthy and served Nero, which he tried to justify. Readers sometimes read that gap as hypocrisy, and sometimes as proof that these are ideals people struggle to meet.','At the end of today, ask three questions as Seneca did: what bad habit did I resist, what did I do well, and what could I do better?'],
marcus:['Marcus wrote to himself, often at dawn, reminding himself that he would meet selfish people, that he was part of a larger whole, and that he could choose how to respond. The notes return to impermanence: fame fades and everything changes. His answer is to do the task in front of him and do it well.','Some find the notes bleak or repetitive, and note the tension of a ruler writing of detachment while fighting wars. Historians also remind us that we know the Meditations only through manuscripts and cannot be sure of his intended order.','Start tomorrow by writing one sentence about a likely irritation and how you will respond to it well.'],
mencius:['Mencius supported the claim that humans have four sprouts: compassion, shame, deference and a sense of right and wrong. His example is a child about to fall into a well: anyone would feel alarm. Education is like farming, he said: you cannot tug a sprout upward, but you can remove what harms it.','Critics, beginning with Xunzi, say that people’s selfishness is plain and that goodness needs training. Evolutionary and psychological work suggests humans have both prosocial and selfish tendencies, which lets both sides claim some support.','Recall a time you acted kindly before thinking. What conditions made that easy, and how could you create more of them?'],
zhuangzi:['Zhuangzi uses stories to loosen fixed views: the butcher whose knife never dulls because he follows the ox’s natural lines, the frog in the well who thinks the sky is small. He treats usefulness as relative: the gnarled tree survives because it is of no use to carpenters. Freedom comes from adjusting to change.','Some say that his relaxed attitude to right and wrong risks relativism, and ask how one acts when positions cannot be ranked. Scholars also point out that the book includes layers written by different hands, so views are not uniform.','Take a strong opinion you hold. Write the best case a thoughtful person from another background might give for the opposite.'],
augustine:['In the Confessions, Augustine looks at his own life, a restless youth, ambition, a long search through philosophies, and sees it as a journey toward rest in God. He is fascinated by time: the past is memory, the future is expectation, and the present has no length. In the City of God he argues that history is a contest between two loves.','Critics point to his harsh teaching on original sin and to arguments he made in favor of coercing heretics. His intense focus on sin and desire has been taken by some as unhealthy. Others admire the honesty of his self-examination.','Write about one thing you keep wanting that you suspect will not satisfy you. What might you be wanting underneath it?'],
aquinas:['Aquinas’s five ways reason from features of the world, such as motion and cause, to a first cause he calls God. In ethics he follows Aristotle: humans aim at happiness, and virtues help us get there. He holds that natural law can be known by reason, and that an unjust law is not truly law.','Critics, including Hume and Kant, dispute the cosmological arguments. Others say that treating nature as having built-in purposes does not fit modern science. Still, his careful method of stating objections before answering them is widely admired.','Take a belief you hold. Write the strongest objection first, as Aquinas would, and only then your reply.'],
avicenna:['Avicenna distinguished what a thing is from the fact that it is. For things we know, existence is something added; only one being, he argued, exists necessarily by its own nature. His account of the soul includes the floating man, an argument that we know ourselves directly, apart from the body.','Al-Ghazali attacked parts of his philosophy, saying it overreached on topics like the eternity of the world. Modern readers also note his medical works reflected the science of his time, which was later improved.','Close your eyes for a minute and drop awareness of your body. What remains of “you” in that moment?'],
alghazali:['Al-Ghazali, a top scholar, found that he could not escape doubt by reasoning alone and withdrew into a period of crisis and spiritual practice. He concluded that some knowledge comes through direct experience, like knowing what drunkenness is only by being drunk. He criticized philosophers on some points while also using logic.','Critics, notably Averroes, said he misrepresented philosophers and weakened the study of nature. Others note that his turn to mysticism reshaped Islamic thought but cannot be said to have ended philosophy there, which continued for centuries.','Name something you only know from reading. What would it take to know it from experience, even a small version?'],
maimonides:['In the Guide for the Perplexed, Maimonides argues that statements about God’s body in scripture are figures of speech. We can say what God is not more safely than what God is. He also set out thirteen principles of Jewish faith and wrote a major code of Jewish law, the Mishneh Torah.','Some contemporaries thought he gave too much to Aristotle and risked undermining tradition, and some of his works were burned in controversy. Modern scholars debate how openly he meant his views, since he says he sometimes writes with hidden meaning.','Try describing something important to you by what it is not. Notice what this reveals that a direct description misses.'],
ibnkhaldun:['In the Muqaddimah Ibn Khaldun looks for patterns: groups with strong solidarity (asabiyyah) conquer, then become comfortable and dependent on taxes, and are replaced. He studies economy, geography and culture as causes. He insists a historian must test reports against what is plausible, not just repeat them.','Critics say his cycle of about three generations oversimplifies, and that it fits North Africa better than elsewhere. Some modern readers also warn against casting him as a “modern” economist, since his frame is his own.','Pick an organization you know. Where is solidarity strong, and where is comfort starting to wear it down?'],
machiavelli:['In The Prince, Machiavelli advises new rulers to be feared if they cannot be loved, to keep their word only when useful, and to prepare for fortune’s changes with boldness. In the Discourses, he favors a republic where conflict between classes keeps liberty alive. He judges by results.','Critics say he reduces politics to power and excuses cruelty. Others argue the book is a satire or a hard-nosed description rather than endorsement. His distinction between virtù and conventional virtue is widely debated.','Think of a decision you faced. Write what a purely realistic adviser would say, then what an idealist would say, and compare.'],
wangyangming:['Wang Yangming held that the principle of things is not out there to be investigated but is in the mind’s innate knowing. He argued that knowing and acting are one: genuine knowledge shows in action, as feeling a smell and disliking it are one event. Self-cultivation means removing selfish desires that cloud the mind.','Zhu Xi’s followers argued that this underrates study and the investigation of the outer world. Critics have said his teaching could lead to subjectivism, and some later followers pushed it too far.','Pick one thing you say you value. What is one action this week that would prove you really know it?'],
hobbes:['Hobbes starts from a picture of people as roughly equal and driven by fear and desire. Without a power to keep order, he thinks everyone must guard against everyone. So people agree to hand their power to a sovereign who enforces peace. Obedience is owed so long as the sovereign protects.','Locke objected that Hobbes lets rulers do too much and gives people no right to resist. Critics also say his picture of human nature is too grim. Defenders say he captured what a collapse of order looks like, as in civil wars.','Think of a rule you resent. What would the situation look like if that rule did not exist?'],
descartes:['Descartes resolved to doubt everything he could, and found that even if an evil demon deceived him, he could not doubt that he was thinking. From that point he tried to rebuild knowledge. He split reality into thinking mind and extended matter, which raised the problem of how they interact.','Critics say the cogito is less certain than it looks, and that his reasoning for God’s existence is circular. The mind–body split led to long-standing puzzles. Many now think mind is better understood as embodied.','Write down three things you are sure of. For each, ask what could be mistaken if your senses or memory were off.'],
spinoza:['In the Ethics, Spinoza argues from definitions that there is one substance, God or Nature, and that minds and bodies are two aspects of it. Emotions are natural events with causes. To understand them clearly turns passive feelings into active ones and brings a kind of joy.','Critics say his God is not a God at all, and at the time he was accused of atheism. Others ask whether a world of strict necessity leaves room for choice, a puzzle his view faces directly.','Pick a strong feeling from this week. Write down its causes as plainly as you can, as if explaining a natural event.'],
locke:['Locke argued that the mind begins blank and builds ideas from sensation and reflection. In politics, people in a state of nature have rights, and they form governments to protect them. If a government violates its trust, people may change it.','Critics note that his own period involved slavery and colonial land claims that his theory of property seems to support. Others challenge the blank-slate view with evidence of inborn structures in the mind.','Pick one view you hold and trace where you first learned it. Was it from experience, or was it handed to you?'],
leibniz:['Leibniz held that the universe consists of monads, simple substances that do not interact but each mirror the whole in harmony, set up in advance by God. He argued this world is the best of all possible worlds, and he developed calculus and early binary notation.','Voltaire’s Candide lampoons the optimism. Critics say that evil makes the claim hard to defend. Others find monads obscure, though Leibniz’s ideas about information and logic have proven fruitful.','Choose one hardship from your life. Ask what you would lose if it had not happened, and decide how the answer feels.'],
hume:['Hume argues that all our ideas come from impressions, and that we never observe necessary connection between cause and effect, only repeated succession. The self, he says, is a bundle of perceptions. In ethics he claims reason is the slave of the passions, and that you cannot derive an “ought” from an “is.”','Critics say he leaves too little for knowledge, and some worry his skepticism undermines science. Reid and Kant each answered him. Others point out that Hume himself said such doubts fade when we return to daily life.','Look for a self in your own experience for a minute. What do you find, and does it feel like a single thing?'],
rousseau:['Rousseau argues that inequality grew with property and comparison, and that civil society can restore freedom only if citizens make laws together under a general will. His Emile proposes an education that follows a child’s nature and curiosity. He also wrote a famous autobiography.','Critics say the general will can become an excuse to force people to be free. His own life, including abandoning his children, strikes many as hypocritical. Some say he romanticized nature.','Pick a rule that affects you. Ask what you would think of it if you had a real vote in making it.'],
kant:['Kant argues that the mind shapes experience through categories like space, time and cause, so we know things as they appear, not as they are in themselves. In ethics, the categorical imperative has several forms: act only on rules you could will to be universal, and treat people never merely as means.','Critics say the universal-law test is too rigid, as with lying to a murderer at the door. Others ask how things in themselves can be unknowable yet real. Hegel and many others pushed beyond him.','Before a choice today, ask whether you could want everyone in your position to act the same way.'],
wollstonecraft:['Wollstonecraft argued that women are made “weak” by an education that trains them to charm rather than reason. She called for national, co-educational schooling and for marriage as friendship between equals. She also argued that virtue must rest on reason, not on deference.','Later critics note that she sometimes accepts stereotypes of women’s frivolity and that her class assumptions show. Others have argued over how far her reasoning departs from the conventions of her time.','Notice a place where you assume someone cannot do something. Ask what opportunities they have been given.'],
hegel:['Hegel saw history as the growth of freedom, in which spirit becomes aware of itself. A concept contains tensions that drive it to a richer one, which is why he speaks of dialectic. In the master–slave passage he argues that self-consciousness depends on being recognized by another.','Critics, including Kierkegaard and Marx, said he put system above real lives or ideas above material conditions. Popper called him an enemy of open societies. His prose is also notoriously difficult.','Think of a disagreement. Write what each side gets right, and what a view that kept both would look like.'],
schopenhauer:['Schopenhauer argued that the thing-in-itself is a blind will, and that we know it from within as our own striving. Life swings between wanting and boredom. Relief comes from aesthetic contemplation, compassion and denying the will. He admired Indian and Buddhist thought.','Critics say his pessimism is a temperament dressed as argument. His own life was often bitter. Others say that his psychology of desire and his focus on compassion remain valuable regardless.','Spend ten minutes with a piece of music or art with no goal. Notice what happens to your wanting.'],
mill:['Mill refined utilitarianism by distinguishing higher and lower pleasures: better to be Socrates dissatisfied than a fool satisfied. In On Liberty, he argues that power over a person is justified only to prevent harm to others, and that free discussion is the best way to find truth. He also argued for women’s equality.','Critics ask whether higher pleasures can be ranked without an outside standard. The harm principle is hard to apply: what counts as harm? Others say utilitarianism ignores the separateness of persons.','Think of an opinion you dislike. Write what you would lose if no one were allowed to say it.'],
kierkegaard:['Kierkegaard described three stages: aesthetic (living for enjoyment), ethical (living by duty), and religious (a leap of faith). Anxiety is the dizziness of freedom. He attacked comfortable Christianity and mass opinion, and said truth is something you live, not just think.','Critics say the leap can sound irrational or dangerous, as in Abraham’s case. His pseudonyms make it hard to say what he himself believed. Others say his insistence on inwardness neglects social life.','Pick a choice you are delaying. Imagine the first small action that would commit you, and take it if it is right.'],
marx:['Marx argued that how a society produces goods shapes its politics and ideas. Under capitalism, workers sell labor and do not control what they make, so they feel alienated. Profit pressures drive crises. He expected a class struggle leading to a classless society.','Critics say predictions failed, that regimes using his name were repressive, and that economic factors do not explain everything. Defenders say his analysis of power and inequality is still useful, apart from what was later done.','Describe one part of your work: who decides how you do it, and who benefits from the result?'],
nietzsche:['Nietzsche said the old foundations of values were fading (“God is dead”) and asked what would replace them. He traced moral ideas to history and power in the Genealogy. He urged a creative self-overcoming and the affirmation of life, including its suffering.','Critics say he is dangerously elitist and that his images of strength were abused by others. Some say he undermines the moral concepts he relies on. Scholars debate whether eternal recurrence is meant as truth or as a test.','Ask: if this week repeated forever, what would I change? Pick one change and make it.'],
wittgenstein:['In the Tractatus he argued that language pictures facts and that what cannot be said must be passed over in silence. Later he said that meaning is use, that rules are practices, and that there is no private language. Philosophical problems arise when words go idle, “like an engine running without a load.”','Critics say the later work offers no theories and can seem evasive. Others dispute how to read the Tractatus. His cryptic style makes both fans and critics unsure what he wanted.','Pick a philosophical-sounding word, like “mind” or “free.” Write three ordinary sentences where you use it and see what it does in each.'],
heidegger:['Heidegger asks what it means to be. In Being and Time he starts with Dasein, our kind of being, who cares about its own existence. He describes moods like anxiety, being-toward-death, and the way we first meet things as tools. Later he worries that technology treats everything as a stock to be used.','His membership in the Nazi Party and his silence afterward trouble many readers and affect how his work is read. Critics also find his style obscure and his terms opaque. Others still see the work as important.','Notice a tool you use daily. What would you notice about it if it broke or vanished for a day?'],
sartre:['Sartre argues that consciousness is a kind of nothingness that lets us step back from our situation and choose. Because there is no fixed human nature, we are condemned to be free. Pretending we have no choice is bad faith. We also exist for others, whose look turns us into objects.','Critics say that his radical freedom ignores how circumstances limit choice, a point Beauvoir developed. Others note that his later political commitments, including support for repressive regimes, were mistaken.','Think of something you say you “have to” do. Try rewording it as “I choose to,” and see if it is true.'],
beauvoir:['Beauvoir’s The Second Sex shows how women have been treated as the Other and how myths, laws and upbringing make “woman.” She argues that freedom is shared: oppressing others limits one’s own. In ethics she says life is ambiguous, both free and limited, and that this is the starting point of moral action.','Critics say she underrates the value of motherhood or that her analysis reflects a specific class and era. Later feminists, including Black and postcolonial thinkers, have extended and challenged her account.','Choose one expectation you follow without choosing it. Decide whether to keep it, change it, or drop it.'],
arendt:['Arendt distinguishes labor (meeting needs), work (building a lasting world) and action (beginning something new among others). Political life depends on a public space where people appear to one another. In studying totalitarianism she argued that isolation and loss of a shared world make people vulnerable. In Eichmann she saw thoughtlessness at work.','Critics said her portrait of Eichmann understated his antisemitism. Her distinctions between social and political can seem rigid. Her admiration of Greek politics left out slaves and women.','Name one thing you could start with others in your community. What is the first small step?'],
camus:['In The Myth of Sisyphus, Camus asks whether life is worth living without ultimate meaning. He rejects suicide and also false hope, and proposes revolt: living fully, with awareness. In The Rebel, he argues that revolt must keep limits and not justify murder, which led to his break with Sartre.','Critics say that he declines to give a firm basis for ethics. Some find the absurd a mood, not an argument. Others point out his blind spots about colonial Algeria.','Choose one ordinary task today. Do it as if it were enough, with full attention.'],
rawls:['Rawls’s original position asks what rules you would choose behind a veil of ignorance, not knowing your talents, class or beliefs. He argues you would choose equal basic liberties, fair opportunity, and inequalities only if they benefit the least advantaged. He later asked how people with different beliefs can still share a political order.','Nozick argued the theory slights individual rights to what people earn. Communitarians say it neglects shared identity. Feminists have noted that the family is left largely outside the theory. Others find the veil too abstract.','Take a rule in your workplace or family. Ask whether you would accept it if you did not know your role.'],
thales:['Thales asked what stays the same beneath change. His answer, water, matters less than the move: explaining nature by nature, with no gods acting as causes. Reports also credit him with practical geometry and with astronomy that helped sailors.','Aristotle suspected the water claim came from observing that life needs moisture, which is not strong evidence. Most details of his life are legends passed down by later writers, so be cautious.','Pick a puzzling thing that happened. Write one natural explanation, even a guess, instead of “it just happens.”'],
anaximander:['Anaximander argued that no single element could be the source of all, because it would overpower its opposites. So the source must be indefinite, the boundless. Opposites such as hot and cold pay a kind of penalty to one another over time, which keeps balance in the cosmos.','His account is speculation without evidence we would accept. Only a fragment survives, so scholars disagree about what the boundless was, and our picture depends on Aristotle’s later report.','Think of a balance in your life, such as work and rest. Where is one side taking more than its share?'],
pythagoras:['The Pythagoreans noticed that musical intervals follow simple ratios, which suggested that number lies behind nature. They also kept rules of life, including silence and diet, and believed souls could move between bodies. Mathematics and mysticism ran together.','Much of what is called Pythagorean was later added by followers, so the founder is hard to isolate. The discovery of irrational numbers, like the square root of two, challenged the idea that everything is a ratio of whole numbers.','Listen to a note and its octave. Hum both and notice how simple the relation sounds.'],
heraclitus:['Heraclitus held that the world is a fire-like process, always changing yet governed by logos. Opposites are bound in tension, as a bow or lyre works through tension. Most people, he complained, sleepwalk and do not grasp this shared order.','His sayings are cryptic and survive only in quotation, so interpretation is uncertain. Parmenides took the opposite position. A critic would ask whether “everything changes” is itself an unchanging claim.','Notice one thing today that you thought was fixed but has quietly shifted since last year.'],
parmenides:['Parmenides argued that you cannot think or speak of what is not, so all talk of coming-to-be and perishing is confused. What is must be one, uncreated and unchanging. The senses show a world of change, but the way of truth rejects them.','Critics say the argument depends on a slippery use of “is” and that denying change makes ordinary life incoherent. Later thinkers, such as the atomists, tried to keep his logic while allowing motion.','Pick something you assume has changed. Ask what in it stayed the same, and what that tells you.'],
zenoelea:['Zeno’s paradoxes include the dichotomy (to reach a goal you must first go halfway, and so on) and the arrow (at each instant it is still). They aim to show that plurality and motion lead to absurdity, so Parmenides was right.','Mathematics now explains infinite sums that converge, which answers some paradoxes. Philosophers still debate whether it answers all, especially about the nature of space and time at tiny scales.','Choose a big goal and list five smaller steps. Do the first one before the day ends.'],
empedocles:['Empedocles tried to rescue change from Parmenides: the four roots do not come to be or perish, they only mix and separate. Love draws things together and Strife pulls apart, in cycles. He also described early ideas about how living forms arose and wrote about perception.','Aristotle objected that the roots and the two forces are not well explained. His mythical and poetic claims, including reincarnation, sit uneasily with his physics.','Think of a relationship or project in a phase of coming together or pulling apart. Which phase is it?'],
anaxagoras:['Anaxagoras said that in the beginning everything was mixed, and Mind set a rotation that separated things out. Every thing keeps a portion of every other, which is why a seed can become hair, flesh or bone. He explained eclipses and the moon’s light naturally.','Socrates, in Plato’s Phaedo, complains that Anaxagoras uses Mind in speech but then explains things by air and water, not by what is best. His trial for impiety shows the cost of such claims.','Pick a thing that seems pure. Try to find the mixture inside it.'],
democritus:['For Democritus, atoms differ in shape, size and position, and sensible qualities like sweet and bitter arise from their arrangements. He extended this to the soul, which he thought was made of fine, round atoms. He is also credited with ethical sayings about cheerfulness and moderation.','Aristotle criticized atomism for not explaining motion and the origin of order. Without experiments, the idea was a philosophical posit, so claims of anticipating modern science should be measured.','Take one object near you and ask what simpler parts it is made of, and what those parts are made of.'],
protagoras:['Protagoras taught that on any question there are two opposing arguments, and a skilled teacher can strengthen the weaker. His “measure” saying suggests that things are for each person as they appear to them. He also gave an account of how humans acquired civic virtue.','Plato argued that if each person’s opinion is true for them, then Protagoras’s own opponents are right too. Critics also say the Sophists cared more about winning than truth. Still, the debate about relativism shows no sign of ending.','Pick a topic where people disagree. Write the best argument for each side before choosing one.'],
diogenes:['Diogenes “defaced the currency,” in the phrase of the tradition, by rejecting social conventions about money, shame and status. He ate, slept and relieved himself in public to show these were natural. Cynic practice was a training of the body and mind in endurance.','Critics found him rude and shameless, and some stories are fiction. A fair question is whether living outside society helps anyone but oneself. Later Stoics took the self-sufficiency and left the shock tactics.','Go one day without buying something you usually buy. Notice how much of the habit is need and how much custom.'],
pyrrho:['Pyrrhonians held that for any claim an equally strong opposing claim can be found, which leads to suspension of judgment and then tranquility. They live by appearances and custom without claiming to know how things really are. It is a way of life as much as a theory.','Critics say that one cannot act without beliefs, and that “suspend judgment on everything” seems self-undermining. Pyrrhonists reply that they merely report how things appear and do not assert it as a doctrine.','Next time you feel certain, list one reason on each side. Notice whether your certainty relaxes.'],
zenocitium:['The Stoics divide philosophy into logic, physics and ethics, and see the cosmos as a rational whole. To live well is to align your will with nature, treating externals like wealth as “preferred indifferents.” Emotions arise from false judgments and can be reformed.','Critics found the ideal of the passionless sage inhuman. Others asked how all external things can be indifferent while still being preferred. Later Stoics softened some claims, and ancient sources about Zeno are fragmentary.','Pick something you want but can lose. Practice wanting it without needing it for a day.'],
lucretius:['On the Nature of Things argues from atoms and void that the soul is mortal, the gods do not meddle, and nothing comes from nothing. The poem ends with a description of plague. His aim is therapeutic: to free readers from fear by showing the natural causes of things.','Critics argue that the “symmetry” argument (we do not mind before birth, so we should not mind after death) does not remove all worry about death. His physics was wrong in many details, but his aim to explain nature without fear has lasted.','Think of one fear. Write what natural causes might explain it, and whether it deserves its hold.'],
cicero:['In On Duties Cicero argues that what is honorable and what is useful cannot truly conflict, and that duties arise from our roles and our shared humanity. He mixes Stoic ideas with Roman practice and defends civic participation. His letters show a man torn between principle and survival.','Critics note that Cicero was often vain and shifted his positions with politics. His philosophy borrows heavily, and he said so. Yet this gift for explaining ideas made Greek thought widely available in Latin.','Think of a time when doing right and doing what is useful pulled apart. Which won, and why?'],
sextus:['Sextus lays out “modes” of skeptical argument, such as the disagreement among experts and the regress of reasons. He says that after suspending judgment on things that cannot be settled, tranquility follows “as a shadow follows a body.” He aims at everyday life rather than abstract doctrine.','Critics ask how a skeptic can know to follow appearances without assuming anything. Some of his targets, like the arts and sciences, are treated unfairly. Even so, his work gave later thinkers a ready toolbox of doubts.','Pick a topic on which experts disagree. Write what you would do if you simply withheld judgment for now.'],
plotinus:['Plotinus describes the One as beyond being and thought; from it overflows Intellect, then Soul, then the material world. Evil is lack, a distance from the One. Philosophy is a path of turning inward and upward, and he reports moments of union.','Critics say that the One cannot be talked about at all, yet he talks about it. Christians found the hierarchy too impersonal, though many borrowed from it. His account of matter as almost nothing is odd to modern ears.','Sit quietly for five minutes and let thoughts settle, as if turning attention from many things toward one.'],
hypatia:['Hypatia lectured on mathematics and philosophy and may have edited a work of Ptolemy. Letters from Synesius mention her teaching about instruments such as the astrolabe. She advised city officials and was widely respected.','Because her own writings are lost, claims about her views rest on later sources, and some modern portrayals simplify the political conflict that led to her death. The evidence supports respect for her learning and caution about the legends.','Think of a teacher you value. Write them one line of thanks today.'],
mozi:['Mozi argues that partiality is the root of conflict: when people favor their own families and states, violence follows. If we care for others as for ourselves, harm will fall. He judges rulers, music and rituals by whether they bring benefit, and condemns offensive war.','Mencius answered that universal love denies special obligations to family, calling it “fatherless.” Critics also doubt that people can care equally for everyone. Mohist logic was largely lost after the Han but has been recovered by modern scholars.','Before the next decision, write down everyone it affects, including people far from you.'],
xunzi:['Xunzi says people’s natural tendencies lead to conflict, so the sages created ritual and law to shape them. Learning is gradual and must be sustained, like building a mountain from earth. He denies that Heaven punishes or rewards; humans must govern themselves.','Mencius’s followers say he cannot explain where the sages’ goodness came from if everyone starts selfish. Han Fei took his realism further than Xunzi would have wished. Still, his stress on practice resembles modern habit research.','Pick one good habit. Plan a small daily practice for seven days, and note what the repetition changes.'],
hanfei:['Han Fei argues that rulers cannot rely on officials’ virtue, so laws must be public, rewards and punishments must be sure, and the ruler must hide his preferences. He uses fables, like the man who waited by a stump for another rabbit, to mock reliance on tradition.','Critics say the system depends on a cold and manipulative ruler and neglects the legitimacy that comes from care. The Qin state that applied Legalist ideas fell quickly. Later dynasties kept laws but blended them with Confucian ideals.','Think of a rule in your life that no one follows. What would make it clear and enforced, or end it?'],
mahavira:['Jain teaching holds that souls are bound by karma, which is understood as a kind of subtle matter, and freed through right belief, knowledge and conduct. Ahimsa governs thought, speech and action, shaping diet and livelihood. The many-sidedness doctrine invites humility about claims.','Critics have asked whether strict nonviolence is workable. Jain ascetic practices, including fasting, are demanding. Our knowledge of Mahavira’s life comes from texts recorded later by his tradition.','For one day, notice how your choices affect other living things. Change one small thing.'],
gargi:['In the Upanishadic debate, Gargi asks what everything is woven upon, and Yajnavalkya answers step by step until he says that the imperishable is the final ground. When she asks too far, he warns her that her head may fall. She later gains recognition and speaks again.','Little else is known about her, and the story may be literary. Still, it shows that early Vedic debate included women, though the tradition later narrowed their role.','Write down a question you have been told is too big or too odd. Ask it of someone this week.'],
nagarjuna:['Nagarjuna uses the “tetralemma” to show that claims about things having intrinsic nature fall apart. If something existed independently, it could not change or depend on causes, but everything does. So emptiness is the final truth; but emptiness itself is empty too, so he is not asserting another thing.','Opponents asked whether, if everything is empty, even his arguments are empty and so powerless. He replied that they work conventionally. Scholars still debate whether he is a skeptic, a nihilist or neither.','Pick a thing you call “mine,” like a job or a name. Ask what causes and conditions it depends on.'],
vasubandhu:['Vasubandhu argues that perceptions of external objects can be explained as ripples in consciousness, as in dreams. He describes a store consciousness that holds seeds of past experience. The goal is to see that subject and object are both constructed.','Critics ask how, if everything is mind, we share a common world. Vasubandhu answers that shared karma produces shared appearances. Some scholars read this as idealism, while others read it as a method for freeing the mind.','Notice how a mood colors the same room differently at different times.'],
shankara:['Shankara reads the Upanishads as teaching that Brahman alone is real, and the world is appearance, like a rope mistaken for a snake. Liberation comes through knowledge, not action. Teachers help the student realize “you are that.”','Ramanuja argued that this makes the world and individual souls unreal, which devotional experience denies. Others, including Buddhists, found the idea of an unchanging self problematic. Scholars also debate which works are truly by him.','Next time you misjudge something, such as a shadow taken for an object, note how quickly the mind assigns a false picture.'],
ramanuja:['Ramanuja holds that Brahman has attributes and is a personal God, Vishnu. Souls and matter are real but depend on him as a body on its soul. Surrender and devotion are the way, and grace answers.','Shankara’s followers say that relations between God and souls are less ultimate than he claims. Ramanuja’s critics also note the hierarchy of caste in some of his social views. He nevertheless opened devotion to many people.','Write one thing you could do today out of love, not duty.'],
vivekananda:['Vivekananda taught four paths to the divine: knowledge, devotion, work and meditation. He argued that each person is divine and that service to the poor is worship. He met Western audiences with a message of religious harmony.','Critics have said that he presented Hinduism in a shaped way for Western tastes and downplayed caste. Others admire how he reframed Vedanta for modern life. His speeches remain widely read.','Choose a task for someone else that you can do quietly this week, with no credit.'],
gandhi:['Gandhi’s satyagraha includes refusal to cooperate with injustice, willingness to accept penalty without violence, and attention to the opponent’s humanity. Campaigns like the Salt March used symbolic acts. He also experimented with diet, spinning and communal living.','Critics note his early views on race in South Africa, his positions on caste, and some of his personal experiments. Some argue nonviolence alone did not end British rule. Still, his methods inspired later movements.','Think of a conflict. Write one thing you could do that would be firm and still respect the other person.'],
ambedkar:['Ambedkar argued that untouchability is not a side issue but part of a system that divides people by birth. He pressed for political representation, education and legal protections. In his later years he turned to Buddhism as a path of equality and reason.','Gandhi and Ambedkar disagreed over separate electorates and over reforming Hinduism versus leaving it. Some critics argued over his tactics, while many see his analysis of caste as foundational. His constitutional work set up protections still in use.','Notice a group who gets less access where you live or work. Ask what small barrier you could help remove.'],
zhuxi:['Zhu Xi argued that learning begins with “investigating things” and reading classics, and that reverence keeps the mind steady. Principle is the same in all things, but each person’s qi is more or less clear, which explains differences in virtue.','Wang Yangming said this approach scatters attention outward. Others said that Zhu Xi’s orthodoxy, once adopted for exams, hardened into dogma. Women and commoners had limited access to the education he valued.','Choose one thing to investigate carefully this week, such as how a local building was designed, and take notes.'],
dogen:['Dōgen writes that to study the Buddha way is to study the self, and to study the self is to forget the self. He treats time as being-time: each moment is complete. Everyday acts, like cooking or washing, express awakening.','Critics in other Buddhist schools said that practice-realization can discourage striving. Dōgen’s prose is dense and poetic. Modern readers also debate how his later, stricter views fit his early ones.','Wash a dish or fold laundry with complete attention, as if it were the only task.'],
yihwang:['Yi Hwang held that principle (li) initiates moral feelings while qi accompanies the rest. He urged reverence as the way to keep the mind collected, and advised students to read quietly. His letters on the Four-Seven debate set the main lines for Korean Neo-Confucianism.','Ki Daesung and later thinkers such as Yi I argued that the two cannot be so neatly divided. Critics say that the debates can seem technical, but they carried real implications for how to cultivate character.','Take five minutes to sit still and read one page slowly with full attention.'],
nishida:['Nishida starts from pure experience, in which subject and object are not yet split, such as being absorbed in a melody. He later developed the “logic of place” and the idea of absolute nothingness as the field in which things appear. He tries to say Zen insight in philosophical terms.','Critics say his writing is abstract and hard to test. Some of his students’ later political writing in wartime is controversial, which has led to debate about the Kyoto School and nationalism.','Recall a moment of complete absorption. What made it easy to forget yourself?'],
watsuji:['Watsuji points out that the Japanese word for person, ningen, combines “human” and “between.” Ethics studies how we exist in the betweenness of family, community and state. In Climate and Culture he suggests that environments shape ways of living.','Critics say his climate typology is crude and that he gave too much weight to the state. His postwar edits and earlier nationalism raise questions. His idea about relational selfhood remains useful.','Draw a small map of the people who shape who you are. Who are the three closest links?'],
alkindi:['Al-Kindi argues in On First Philosophy that the study of truth is the noblest pursuit and that the Greeks’ work should be welcomed. He gives arguments that the world has a beginning and that the One is the source of unity. He also wrote on perfumes, cryptography and music.','Some religious scholars objected to using Greek philosophy. Critics also note that his writings are only partly preserved and that his arguments for creation drew on Greek sources. His role as an organizer of the project mattered most.','Find one idea from a tradition you rarely read. Read a page of it with an open mind.'],
alfarabi:['Al-Farabi sets out the Virtuous City as an organized whole under a ruler of philosophical virtue. He also compares different regimes, such as ignorant and mistaken cities. He wrote commentaries on Aristotle and explained how prophecy and philosophy relate through imagination.','Critics say the ruler-philosopher ideal is not practical. Some scholars read him as hiding his full views to protect himself. His work on logic and the sciences also influenced later writers more directly.','Think of a group you belong to. What would it take for it to aim at the good of all its members?'],
saadia:['Saadia’s Book of Beliefs and Opinions argues for creation, the unity of God and the usefulness of revelation, even where reason could reach some truths. He lists four sources of knowledge: sense, intuition, reason and reliable tradition.','Critics from the Karaite camp rejected rabbinic tradition. Some later thinkers thought his arguments for creation were too fragile. He also used reason to reinterpret some scripture, which was controversial.','Write down a belief you hold on tradition. Ask what a reasoned test of it would look like.'],
boethius:['In the Consolation, Lady Philosophy tells the imprisoned author that fortune is fickle by nature and that real happiness lies in the good. She also argues that God’s knowledge of the future does not remove human freedom, because God sees all moments at once.','Critics note that the work does not mention Christ directly, which has puzzled readers. Others find the time solution to freedom and foreknowledge unconvincing. Still, it shaped Dante, Chaucer and many others.','Write down what you would still have if you lost your job, status and possessions tomorrow.'],
anselm:['Anselm’s Proslogion prayer reasons that even a fool who denies God understands the phrase “that than which nothing greater can be thought.” If it existed only in the mind, something greater could be thought. In Cur Deus Homo he proposes an account of why God became human.','Gaunilo replied with a perfect island; Anselm answered that the argument applies to a necessary being only. Aquinas and Kant rejected it too. Even so, the argument has defenders, such as Plantinga in a modal form.','Try stating a belief as a definition, then ask whether the conclusion follows or is just hidden in the definition.'],
abelard:['In Sic et Non, Abelard lists statements from authorities that seem to conflict and asks readers to reconcile them by reasoning. In ethics, he says sin lies in consent, not in the act. He also argued over universals, saying they are words that signify many things.','Bernard of Clairvaux attacked him for undermining faith, and some of his teachings were condemned. His personal story with Héloïse has sometimes overshadowed his ideas, though many scholars now study both.','Take two statements from experts that appear to conflict. Write a way they could both be true.'],
ibntufayl:['Hayy grows up alone, studies animals and the heavens, reasons his way to the idea of a creator, and reaches a mystical state. He later meets Absal, who has learned religion through scripture, and finds the two agree in substance. Hayy then tries to teach the crowd, and learns that most people need symbols.','Critics see the story as an idealized thought experiment, since no one learns in complete isolation. Some read it as arguing that philosophy is for the few. Others see a plea for tolerance between reason and revelation.','Write one thing you taught yourself without a teacher. How did you know when you had it right?'],
averroes:['Averroes argues in the Decisive Treatise that the law itself calls for philosophical study, and that when reason and scripture seem to conflict, scripture should be interpreted. He distinguishes demonstrative, dialectical and rhetorical arguments for different audiences. In the Incoherence of the Incoherence he defends the philosophers.','Critics said his reading of Aristotle made the soul seem less individual. Some Christian scholars, called Averroists, were condemned in Paris. He also faced exile in his own lifetime, and his books were burned for a time.','Think of a topic you only know from one source. Find a second source that approaches it differently.'],
suhrawardi:['Suhrawardi argues that some knowledge is by presence: we know ourselves directly, not through definitions. Reality is a scale of light, from the Light of Lights down to dark matter. Philosophers must both argue and purify themselves to receive illumination.','Opponents accused him of heresy and the ruler Saladin’s son had him executed. Critics say that illumination is hard to verify. Yet his terms strongly shaped later Persian thought, including Mulla Sadra.','Sit by a window at dawn and watch the light change for five minutes. Note what you see.'],
ibnarabi:['Ibn Arabi describes the world as a series of divine self-disclosures, with the human being as a mirror in which God is seen. Imagination is a real realm between spirit and matter. He is known for saying that his heart has become capable of every form.','Some scholars, such as Ibn Taymiyya, accused him of dissolving the difference between God and creation. Others defend his view as a subtle account of presence. His writing is very long and hard to summarize.','Pause and notice an object of beauty near you. Ask what it shows you about something larger.'],
bonaventure:['In the Soul’s Journey into God, Bonaventure uses Francis’s vision of a six-winged seraph as a map of six stages, from sensing creatures to reaching ecstatic union. Knowledge, he says, must be completed by love, and philosophy by theology.','Aquinas gave a greater role to reason and to Aristotle, while Bonaventure feared Aristotle might lead to error. Critics find his approach less open to natural science. The two remained friends and colleagues.','Choose one ordinary creature or object and look at it with wonder, asking what it points to.'],
eckhart:['Eckhart preached that God is born in the soul when a person lets go of images, desires and even the idea of God. He speaks of a “spark” in the soul that is uncreated. Letting go is not a refusal of action; it makes action free.','Church authorities condemned 28 propositions from his writings after his death, saying they blurred the line between God and the soul. Critics ask how to tell detachment from indifference. His vernacular sermons are bold and poetic.','Sit with one thing you are clinging to. Imagine setting it down for an hour and see what remains.'],
scotus:['Scotus argued that the will is a rational power that can choose between options even when reason presents them, so freedom is not just following the strongest reason. He said being is “univocal”: it means the same thing said of God and creatures, but infinite in God. Each thing has its haecceity.','Aquinas’s followers said univocity makes God too much like creatures. Ockham attacked his realist account of universals. His writing is very technical, which earned him the nickname Subtle Doctor.','Pick one object that matters to you. Write what makes it this one and not just another like it.'],
ockham:['Ockham argues that only individual things exist, and universal terms are signs in the mind that stand for many individuals. He also stressed God’s absolute power: nothing but contradiction limits God. In politics, he questioned papal claims to authority over rulers.','Critics say that nominalism makes scientific laws hard to explain. The razor is a rule of thumb, not a proof that simplicity is true. Some say Ockham’s theology undermined confidence in reason, a charge scholars dispute.','Look at an explanation you have given. Cross out any part that adds nothing.'],
christine:['In the City of Ladies, three allegorical ladies, Reason, Rectitude and Justice, help the narrator lay the foundations and walls with stories of women: warriors, scholars, prophets and saints. She answers specific claims from male authors one by one. Her later Treasure gives advice to women of all ranks.','Her argument stays within the social order of her time, which later feminists have noted. Some find her use of stories rather than philosophical argument less direct. Even so, she brought women’s voices into the debate.','Write down three women or others whose work shaped your field and who are rarely mentioned.'],
erasmus:['Erasmus’s Praise of Folly is spoken by Folly herself, who mocks theologians, monks, rulers and scholars, including Erasmus. His Handbook of the Christian Soldier calls for inner piety over outward show. He edited the Greek New Testament to help readers return to sources.','Luther and Catholic defenders each criticized him for not taking a firmer side. Some thought his satire too sharp, others too mild. His belief in free will provoked Luther’s reply.','Pick a piece of conventional wisdom. Write a short satirical line that shows its weakness.'],
montaigne:['Montaigne examines everything: friendship, death, cannibals, idleness, children, books, himself. Customs, he says, differ widely, so we should be modest about our own. He suggests we learn to die by living well and to take each day as it comes. “Que sais-je?” is his device.','Some say his skepticism leans toward conservatism, as he often favored obeying local custom. Others find his self-portrait vain. Still, he made the examined life a form of literature.','Write one honest paragraph about a habit of yours, with no cleanup.'],
bacon:['Bacon proposed a method of tables of presence and absence to find the forms of natural properties by exclusion. He warned of idols of the tribe, cave, marketplace and theater. He believed that knowledge should be used to improve human life.','Critics say that actual science depends more on hypotheses than on pure collecting of data. His own experimental work was limited. Some also challenge his image of nature as something to be mastered.','Choose a question and write what evidence would settle it before you look for any.'],
pascal:['Pascal wrote that the heart has its reasons that reason does not know. He pictured humans as between two infinities, thinking reeds who are weak but know it. Diversion, he said, keeps us from facing our condition. His wager aims to move the undecided to act.','Critics argue that the wager fails because there are many possible gods and because belief cannot be chosen at will. Others say he treats faith too much as calculation. The Pensées were left in fragments, so we cannot be sure of his design.','Spend ten minutes without a screen or distraction. Notice what comes up.'],
malebranche:['Malebranche reasons that matter is inert and the mind cannot move bodies, so God must be the real cause on each occasion. He also said we know ideas by seeing them in God’s reason. He saw the link between cause and effect as necessary only in God’s will.','Critics, like Arnauld, said this makes God do everything and leaves creatures empty. Leibniz offered pre-established harmony as an alternative. Hume’s later attack on causation may owe something to his arguments.','Pick something that seems to cause something else. Ask what you actually observe: only that one follows the other?'],
astell:['Astell suggested a retreat where women could study and think, and she wrote that custom, not nature, explains much of women’s ignorance. She asked why men claim freedom for themselves while holding women to obedience. She also defended the Church and the monarchy, which shaped her politics.','Her conservative politics trouble some readers who admire her feminism. Others question whether her plan for a religious retreat was realistic. Nonetheless, she wrote some of the earliest sustained arguments for women’s education in English.','Find out which opportunity near you is closed to some people, and what would open it.'],
berkeley:['Berkeley argues that we only ever perceive ideas, and that “matter” as something beyond perception is an empty notion. Things persist because God perceives them. He also criticized abstract general ideas and published a theory of vision.','Critics say the view makes the world depend on being perceived, which sounds absurd. Johnson’s stone-kicking reply misses the point, since Berkeley accepts the stone’s solidity as an idea. Idealism has few defenders today, but his arguments force clarity about perception.','Look at an object. Describe it using only what you see, feel and hear. What is left unaccounted for?'],
vico:['Vico argued that the human world is knowable because humans made it: myths, languages and laws reveal the mental life of earlier ages. He saw nations moving from an age of gods to heroes to humans, then possibly back. Poetry, he said, comes before prose.','His cycles were criticized as speculative, and some of his claims about early peoples are unsupported by evidence. His influence came late, on Herder, Hegel and later historians, since few read him in his day.','Think of a custom you take for granted. Ask who made it, and why.'],
mullasadra:['Sadra argues that existence is real and essences are mental abstractions, with existence admitting degrees of intensity. Things are always moving in their very being, so the soul begins as body and can become spiritual. He describes four journeys, from creation to God and back.','Critics said that his blend of philosophy, mysticism and Shia teaching is too eclectic. Some traditionalists attacked philosophy generally. Within the Iranian seminaries, his work became a central text.','Write down two ways you are not the same person you were five years ago.'],
zerayacob:['In his treatise, Zera Yacob says he was persecuted for his views and fled to a cave, where he reflected for years. He argues that reason is given by the Creator, that no religion should be imposed, and that all people are equal. He rejects the rigid distinction of clergy and laity.','Some scholars argue that the treatise was written by Giusto d’Urbino, an Italian priest, but others have defended its authenticity. Either way, the text offers an independent argument of its own that deserves attention.','Take a belief you hold and imagine you had to defend it with reason alone. Write the case.'],
amo:['Amo’s dissertation argues that the mind, as such, does not feel; sensation belongs to the organic body, which the mind is aware of. He lectured at Halle and Jena. He also wrote on how to philosophize clearly and soberly.','Little of his work survives, and records of his life are limited. Some critics say that his position is close to Descartes, while others stress its originality. Historians stress that he worked in a world that gave him few chances.','Look into a historical figure whose story was largely left out. Share one fact you learned with someone.'],
sorjuana:['In the Response, Sor Juana describes how she learned to read as a child, taught herself, and sought knowledge in everything, even in cooking. She argues that women have studied and taught throughout history and that all learning serves theology. Her poem First Dream describes a soul climbing toward knowledge.','Church authorities eventually pressed her to stop writing and sell her library. Whether she was silenced or chose to withdraw is still discussed. Many see her as an early feminist, though she worked within a religious frame.','Choose one subject you were told is not for you. Read about it for fifteen minutes.'],
duchatelet:['Du Châtelet argued that Newtonian physics could be combined with Leibniz’s principles, and she supported the view that a moving body’s energy depends on the square of its velocity. Her Institutions de physique explains how to do science and what role hypotheses play. She also wrote on morals, saying passions are the source of happiness if guided.','Her work was long credited to men, including her partner Voltaire, who helped promote it. Critics note that she was influenced heavily by Leibniz’s metaphysics, which Newtonians rejected. Her translation of the Principia is still cited.','Pick something you have wanted to learn. Block one hour this week and begin.'],
montesquieu:['Montesquieu classified governments as republics, monarchies and despotisms, each with a principle: virtue, honor and fear. He argued that laws relate to climate, commerce and customs. To prevent abuse, power should check power.','Critics say that his climate theory is simplistic. He sometimes accepted slavery in practice while criticizing it in satire. His account of England’s constitution was partly idealized. Yet his model of checks and balances was widely adopted.','List where power sits in an organization you know. What limits it?'],
voltaire:['Voltaire fought for victims of intolerance, such as Jean Calas, a Protestant executed on a false charge. His Philosophical Letters praise English freedoms. His Candide uses a series of calamities to puncture glib optimism, ending with the advice to cultivate one’s garden.','Critics note that he had prejudices of his time, including antisemitic remarks, and that he made money from investments connected with the slave trade. Some say his wit became a substitute for argument. Others think he used it for a good cause.','Find a claim you disagree with. Write a calm, fair statement of it.'],
diderot:['Diderot’s Encyclopédie covered arts, trades and ideas in thousands of articles, with plates of tools and workshops. The project had to evade censorship, using cross-references to hint at forbidden ideas. Diderot’s own works play with dialogue, as in D’Alembert’s Dream.','Critics say the Encyclopédie’s quality was uneven. Diderot himself spent decades on it with limited reward. His private writings, such as Rameau’s Nephew, were published after his death, so many readers met him late.','Write a short how-to for a craft or skill you know, as if for a reader who has never seen it.'],
smith:['Smith’s Moral Sentiments suggests that we form conscience by imagining how an impartial spectator would judge us. In Wealth of Nations, specialization increases productivity, and markets coordinate actions without central direction. He also criticized monopolies and was wary of businessmen’s political influence.','Critics say that markets can produce inequality and harm not captured by the invisible hand. Some readers split the two books, but many scholars find them consistent. His ideas have been used for many causes.','Ask yourself how an impartial observer would see your last decision. What would they notice?'],
reid:['Reid argues that we perceive external objects directly, not through ideas that could be mistaken for them. First principles of common sense, like trusting memory, are not proved but taken for granted by all in practice. Philosophers who deny them end up in absurdity.','Critics say appeals to common sense can protect prejudice. Hume replied that common sense varies. Reid’s defenders say that the question is which beliefs are reasonable to hold without proof, and he gave an answer worth considering.','Pick a belief you rely on without proof. Ask what it would take to live without it.'],
bentham:['Bentham proposes measuring pleasures and pains by intensity, duration, certainty and other factors, and adding them up. He applied the test to laws on prisons, courts, poor relief and animals. He argued that “natural rights” are nonsense on stilts and that law should answer to utility.','Critics say a sum of pleasures ignores justice for individuals, as when sacrificing one person benefits many. Mill said that Bentham’s notion of happiness was too thin. Still, his reform work was extensive and practical.','For one decision, list everyone affected and rate roughly how much it affects each.'],
comte:['Comte’s law of three stages sees human thought moving from theological to metaphysical to positive, or scientific. He arranged the sciences in a ladder from mathematics up to sociology. He later set up a Religion of Humanity with rituals.','Critics found his later religious project absurd and his rigid scheme too confident. Others noted that he was right that human affairs can be studied systematically. The word “altruism” is also credited to him.','Pick a belief about people. Ask what data would support or weaken it.'],
emerson:['Emerson’s essays are loose, aphoristic and rhetorical. He says each person has a share of the universal mind and should trust it. He urges readers not to imitate, to see nature as a symbol and to live with a sense of possibility. He also lectured against slavery.','Critics said his self-reliance neglects community and that he was slow to act on slavery. Hawthorne and Melville questioned his optimism. Others point out that his message was to resist conformity, not to reject others.','Write one sentence that begins “I think…” on a subject where you usually repeat what others say.'],
thoreau:['At Walden Thoreau recorded costs and seasons, and argued that most people live lives of quiet desperation. “Civil Disobedience” says that a majority’s power does not make it right, and that withdrawing support from an unjust government is a duty. He also wrote on the Maine woods and on wild nature.','Critics point out that he did not live far from town and that his mother did his laundry. Others say that civil disobedience has limits in a democracy. Still, he linked personal integrity to political action.','Take a walk for an hour without a device and write down three things you noticed.'],
peirce:['Peirce’s pragmatic maxim says to consider the practical effects an object might have; our conception of those effects is the whole of our conception of the object. He also described inquiry as moving from doubt to belief, and argued that scientific method is the best way to fix belief. His theory of signs has three kinds: icon, index and symbol.','Critics note that it is hard to apply the maxim to ethics or mathematics. Peirce’s own writings are scattered and difficult, and he did not complete a system. William James’s version of pragmatism differs, which Peirce disliked.','Take a vague idea you use. Ask what difference it would make in practice, and write it down.'],
james:['James said that ideas are true if they work, in the sense of leading us well through experience. In “The Will to Believe,” he argues that when a choice is live, forced and momentous, and evidence cannot settle it, we may follow our passional nature. He also studied mystical states.','Critics say that “truth is what works” confuses usefulness with truth. Russell attacked this. James replied that he meant verifiable consequences. The debate about when belief without proof is allowed still continues.','Choose a belief that helps you live better. Ask honestly whether it is also defensible.'],
frege:['Frege introduced quantifiers and a precise notation that made modern logic possible. He distinguished concept and object and argued that numbers are objects, defined through logic. He insisted that thoughts are objective, not psychological.','Russell wrote to Frege in 1902 showing that his system led to a contradiction, and Frege was devastated. Later he also wrote antisemitic remarks in a diary, a troubling fact. His technical work remains foundational.','Pick two phrases that mean the same but feel different. Note which you use when and why.'],
bergson:['Bergson contrasts scientific time, divided into equal units, with lived duration in which past and present interpenetrate. Memory is not stored in the brain but is a persistence of the past. Intuition places us inside the thing. He proposed an élan vital to account for creative evolution.','Critics, including Russell, found the arguments poetic and imprecise. Einstein disputed his view of time in a famous exchange. Biologists reject a vital force. Yet his notion of lived time shaped literature and phenomenology.','Notice how long the last five minutes felt, and compare it with what the clock says.'],
husserl:['Husserl’s method asks us to bracket the assumption that the world exists independently, to attend to how things are given in consciousness. He analyzes intentionality, time-consciousness and the life-world. Later he warned that science forgets the life-world it came from.','Heidegger and Sartre criticized his emphasis on pure consciousness. Others doubt that experience can be described without presuppositions. His style is dense and he left many unpublished manuscripts.','Look at a familiar room. Describe it as if you had never seen it, with no assumptions.'],
dewey:['Dewey argues that knowing is a form of problem solving: we meet an obstacle, form a plan and test it. In education, he sees schools as miniature communities where children learn through projects. Democracy is a way of living together with shared inquiry.','Critics say that progressive education underrates basic knowledge and discipline. Dewey replied that he wanted both interest and rigor. His writing can be wordy. His ideas have been both praised and blamed for changes in schools.','Take a problem and try a small experiment to solve it, then note what you learned.'],
russell:['Russell’s theory of descriptions analyzes sentences like “the present king of France is bald” without needing such a king to exist. He argued that we know things by acquaintance and by description. In popular writing he urged clear thought and criticized dogma and cruelty.','Critics said that his logicism failed after Gödel. Wittgenstein attacked parts of his work. His personal life, with several marriages, drew attention in his day. His peace activism cost him jobs and prison time.','Pick a headline you read today. Ask what evidence supports it, and what would count against it.'],
dubois:['Du Bois combined sociology, history and activism. The Philadelphia Negro (1899) was an early empirical study of a Black community. In The Souls of Black Folk he introduced the veil and double consciousness, and he argued that a “Talented Tenth” should lead. Later he turned toward Pan-Africanism and socialism.','Critics said that the Talented Tenth was elitist, which Du Bois later revised. Booker T. Washington disagreed with him on strategy. His late political positions, including support for communist states, drew controversy. His scholarship is still widely used.','Read one page of The Souls of Black Folk and write what you notice about its language and its argument.'],
gramsci:['Gramsci distinguishes domination by force from leadership by consent. A ruling class secures hegemony when its worldview feels like common sense, spread through schools, press and church. Change therefore requires a long “war of position” to build a counter-culture, not only seizing the state.','Critics say that the concept can explain everything and so nothing, and that the notebooks are fragmentary because he wrote them in prison. Some use his ideas to excuse neglect of economic conditions. Others say that his attention to culture was prescient.','Notice one “common sense” phrase you heard today. Ask who it benefits.'],
popper:['Popper argues that induction cannot prove theories, but we can test them by trying to refute them. Good theories make risky predictions. In politics, he says an open society allows peaceful correction of errors, unlike utopian plans that resist criticism.','Critics, including Kuhn and Lakatos, say that scientists do not abandon theories at the first counterexample. Duhem’s point is that tests involve many assumptions. Popper’s sweeping readings of Plato, Hegel and Marx have also been disputed.','Write one belief of yours in a form that could be shown false. What evidence would do it?'],
gadamer:['In Truth and Method, Gadamer argues that prejudices in the sense of pre-judgments are the starting point of understanding, not just obstacles. A text asks us a question, and interpretation is a dialogue. Tradition is not a cage but the medium of understanding.','Habermas objected that this underrates how tradition can distort and hide power. Critics also ask how to tell productive prejudices from harmful ones. Gadamer replied that dialogue itself exposes them.','Reread a favorite book or passage. What do you see now that you did not before, and what has changed in you?'],
adorno:['Adorno and Horkheimer argue that the Enlightenment’s drive to master nature turns into domination of people. In the culture industry, films and music standardize taste. He values difficult art that resists easy consumption, such as Schoenberg’s music.','Critics say Adorno was elitist about jazz and popular culture, and that he treated audiences as passive. Later cultural studies emphasized how people use media creatively. Still, his questions about commerce and attention are widely relevant.','Skip one automatic scroll or autoplay today and choose something demanding instead.'],
levinas:['For Levinas, the Other is infinitely different from me, and the face commands “do not kill” before any theory. Ethics comes before ontology. The relation is asymmetrical: I am responsible for the Other without expecting reciprocity.','Critics say that the account is hard to apply to politics, where we must compare claims of many others. Levinas introduced the “third” to address this. Some also ask how his focus on the human leaves out animals.','Next time someone speaks to you, give them your full face and attention for a minute.'],
merleauponty:['Merleau-Ponty argues that the body is not an object among objects but our way of having a world. Perception is active and ambiguous, and skills live in the body, as when a typist’s fingers know the keys. He rejects both pure intellectualism and mechanism.','Critics say his descriptions rely heavily on a certain kind of normal body. Later scholars, including disability studies, have developed his ideas in new directions. His relation to Sartre shifted from friendship to dispute.','Walk through your home with your eyes closed for a minute. What does your body know about the space?'],
quine:['In “Two Dogmas,” Quine rejects the analytic–synthetic distinction and the idea that single statements are tested in isolation. Our whole web faces the tribunal of experience, and any part may be revised. He also argued that translation between languages is indeterminate.','Critics say that he blurs differences between logic and fact that matter. Others find his behaviorism about meaning too strict. Even so, his naturalism, treating philosophy as continuous with science, set a direction for much work.','Choose a belief and ask which other beliefs you would have to change if it were wrong.'],
weil:['Weil wrote that attention is the rarest and purest form of generosity. After factory work and the Spanish Civil War she grew interested in the idea of affliction and in rooting people in community. She held that obligations toward others precede rights, and she was drawn to Christianity while never joining the church.','Critics find her asceticism extreme, and her death, linked to refusing food in solidarity with occupied France, is debated. Some see her views of Judaism as unfair. Her writing remains a rare mix of the mystical and the political.','Give someone a complete five minutes of attention today, with no phone.'],
kuhn:['Kuhn describes normal science as puzzle-solving within a paradigm, with anomalies pushed aside until a crisis. A scientific revolution replaces the paradigm, and rival paradigms are partly incommensurable. Choice among them is not just logic but includes values.','Critics, including Popper, worried that the theory makes science irrational or merely social. Kuhn replied that he wanted to describe how science works. Later he clarified that values such as accuracy and simplicity still guide choice.','Think about a field you know. Name a “normal” assumption that most people there rarely question.'],
freire:['Freire argues that the banking model teaches students to accept the world as given. Problem-posing education makes them co-investigators who name the world and act on it. Dialogue requires humility, love and trust.','Critics say that the method can overlook the need for direct instruction and that “conscientization” may be directed by the teacher’s own politics. Some also note practical limits in large classrooms. His literacy work in Brazil nonetheless drew large attention.','Ask one learner or colleague today what they would teach you, and listen.'],
anscombe:['Anscombe argues that an action is intentional under a description and is characterized by a certain kind of “why” question. In “Modern Moral Philosophy,” she says duty-based ethics makes little sense without a divine lawgiver and calls for a better philosophy of psychology. She also opposed the bombing of civilians.','Critics say that her linking of moral obligation to a law-giver is too narrow. Her views on contraception and other topics were controversial. Yet her call to return to virtue shaped later ethics.','Next time you act, ask: under what description would I explain this to someone?'],
murdoch:['Murdoch gives the example of a mother-in-law who revises her view of her daughter-in-law through just and loving attention, with no outward change. Moral change is mostly inner. She sees the Good as a source of energy and views art as a training in unselfish vision.','Critics say that her focus on inner vision gives little guidance in hard choices or politics. Others find her Platonism unfashionable. Her novels dramatize the same themes.','Think of someone you judge harshly. Spend two minutes trying to see them more fairly.'],
foot:['Foot argued that moral evaluation is like evaluation of living things: an oak with weak roots is defective, and a person lacking justice or courage is defective as a human. She also criticized the idea that moral judgments are only expressions of attitude. The trolley case appeared as an example in her abortion paper.','Critics say that “human flourishing” is contested and that nature does not clearly decide what is good. Foot admitted the tension. Her work still gave virtue ethics a rigorous base.','Name three things that help a person flourish. Ask whether your daily routine supports them.'],
fanon:['In Black Skin, White Masks, Fanon describes how being seen as inferior shapes a colonized person’s experience of self. The Wretched of the Earth argues that decolonization is violent in its nature because it replaces one order with another, and warns that a national bourgeoisie may fail the people. He also attended to mental health under colonial rule.','Critics have said that his remarks on violence are dangerous or misread. Many scholars point out that he is describing and analyzing as well as advocating. His clinical experience in Algeria deeply shaped his argument.','Read one paragraph of Fanon. Write what it makes you notice about how people are seen.'],
foucault:['Foucault’s histories argue that ways of understanding madness, illness, crime and sexuality have changed and are tied to institutions. Power is productive, shaping subjects, not just prohibiting. Discipline works through observation, examination and routines.','Critics, including Habermas, say that the view of power as everywhere leaves no basis for criticizing it. Others dispute his historical details. Foucault replied that he was writing histories of the present, to loosen what seems necessary.','Look at one routine at school or work. Ask who designed it and what it trains people to do.'],
derrida:['Derrida argues that Western thought favors speech over writing and presence over absence, and sets up hierarchies such as nature over culture. Deconstruction shows how a text undermines its own oppositions. Words always refer to other words, so meaning is deferred.','Critics say that deconstruction is nihilistic or obscure. Searle and others accused him of misreading Austin. Derrida replied that he was careful and that deconstruction is a form of responsibility to the text.','Read a short passage twice. The second time, look for a word or opposition it depends on but plays down.'],
