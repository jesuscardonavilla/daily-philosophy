# Optional: `brew install xcodegen && xcodegen` regenerates the .xcodeproj from this file.
name: DailyPhilosophy
options:
  bundleIdPrefix: com.jesuscardonavilla
  deploymentTarget:
    iOS: "16.0"
targets:
  DailyPhilosophy:
    type: application
    platform: iOS
    sources:
      - DailyPhilosophy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesuscardonavilla.dailyphilosophy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daily Philosophy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
